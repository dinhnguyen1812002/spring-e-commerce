<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title th:text="${title != null ? title : 'Admin Dashboard'}">Admin Dashboard</title>

    <!-- Tailwind CSS compiled -->
    <link rel="stylesheet" th:href="@{/css/main.css}" />

    <!-- Tailwind CDN as fallback -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <!-- WebSocket -->
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stomp-websocket@2.3.4-next/lib/stomp.min.js"></script>

    <style>
      .dropdown-hidden {
        display: none;
      }

      .sidebar-hidden {
        transform: translateX(-100%);
      }
    </style>
  </head>

  <body class="bg-gray-50">

    <th:block th:fragment="layout(title, pageTitle, pageDescription)">
      <!-- Mobile sidebar backdrop -->
      <div id="sidebarBackdrop" class="fixed inset-0 z-20 bg-black/50 lg:hidden hidden" onclick="toggleSidebar()"></div>

      <div class="min-h-screen flex">
        <!-- Sidebar -->
        <aside id="sidebar"
          class="fixed inset-y-0 left-0 z-30 w-64 bg-white border-r border-gray-200 transform transition-transform duration-300 ease-in-out -translate-x-full lg:translate-x-0">
          <div th:replace="~{fragments/sidebar :: sidebar}"></div>
        </aside>

        <!-- Main Content Area -->
        <div class="flex-1 flex flex-col min-h-screen lg:pl-64">
          <!-- Header -->
          <header class="sticky top-0 z-10 bg-white border-b border-gray-200 shadow-sm">
            <div class="flex items-center justify-between h-16 px-4 lg:px-6">
              <!-- Left side -->
              <div class="flex items-center">
                <!-- Mobile menu button -->
                <button onclick="toggleSidebar()"
                  class="lg:hidden p-2 rounded-md text-gray-500 hover:text-gray-600 hover:bg-gray-100">
                  <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                  </svg>
                </button>
                <!-- Page title -->
                <div class="ml-4 lg:ml-0">
                  <h1 class="text-xl font-semibold text-gray-800" th:text="${pageTitle ?: 'Dashboard'}">Dashboard</h1>
                  <p class="text-sm text-gray-500" th:text="${pageDescription ?: ''}"></p>
                </div>
              </div>

              <!-- Right side -->
              <div class="flex items-center space-x-4">
                <!-- Notifications -->

                    </div>
                    <div class="max-h-64 overflow-y-auto p-2" id="notifications-list">
                      <p class="text-sm text-gray-500 text-center py-4">No new notifications</p>

                  </div>
                </div> -->

                <!-- User menu -->
                <!-- <div class="relative">

          </header>

          <!-- Main content -->
          <main class="flex-1 p-4 lg:p-6 bg-gray-50">
            <th:block th:replace="~{::content}">
              <div class="text-gray-500">No content provided.</div>
            </th:block>
          </main>

          <!-- Footer -->
          <footer class="bg-white border-t border-gray-200 py-4 px-6">
            <div class="flex flex-col md:flex-row justify-between items-center text-sm text-gray-500">
              <p>&copy; 2024 E-Commerce Admin. All rights reserved.</p>
              <div class="flex space-x-4 mt-2 md:mt-0">
                <a href="#" class="hover:text-gray-700"><i class="fas fa-book"></i></a>
                <a href="#" class="hover:text-gray-700"><i class="fas fa-question-circle"></i></a>
              </div>
            </div>
          </footer>
        </div>
      </div>

      <script>
        document.addEventListener('DOMContentLoaded', function () {
          const notificationBtn = document.getElementById('notificationBtn');
          const userMenuBtn = document.getElementById('userMenuBtn');
          const notificationDropdown = document.getElementById('notificationDropdown');
          const userMenuDropdown = document.getElementById('userMenuDropdown');

          if (notificationBtn) {
            notificationBtn.addEventListener('click', function (e) {
              e.stopPropagation();
              userMenuDropdown?.classList.add('dropdown-hidden');
              notificationDropdown?.classList.toggle('dropdown-hidden');
            });
          }

          if (userMenuBtn) {
            userMenuBtn.addEventListener('click', function (e) {
              e.stopPropagation();
              notificationDropdown?.classList.add('dropdown-hidden');
              userMenuDropdown?.classList.toggle('dropdown-hidden');
            });
          }

          document.addEventListener('click', function () {
            notificationDropdown?.classList.add('dropdown-hidden');
            userMenuDropdown?.classList.add('dropdown-hidden');
          });
        });
      </script>

      <script src="/js/admin/notifications.js" defer></script>
