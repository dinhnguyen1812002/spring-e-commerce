<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Traffic Analytics</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.5.0/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3B82F6',
                        secondary: '#64748B',
                        success: '#10B981',
                        warning: '#F59E0B',
                        danger: '#EF4444'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50">
    <div class="flex h-screen">
        <!-- Sidebar -->
        <div th:replace="~{fragments/sidebar :: sidebar}"></div>

        <!-- Main Content -->
        <div class="flex-1 flex flex-col overflow-hidden">
            <!-- Header -->
            <header class="bg-white shadow-sm border-b border-gray-200">
                <div class="flex items-center justify-between px-6 py-4">
                    <div>
                        <h2 class="text-xl font-semibold text-gray-800">Traffic Analytics</h2>
                        <p class="text-sm text-gray-600">Real-time website analytics</p>
                    </div>
                    <div class="flex items-center space-x-4">
                        <div class="relative">
                            <i class="fas fa-bell text-gray-600 text-xl"></i>
                            <span class="absolute -top-1 -right-1 bg-red-500 text-white text-xs rounded-full h-5 w-5 flex items-center justify-center">3</span>
                        </div>
                    </div>
                </div>
            </header>

            <!-- Traffic Content -->
            <main class="flex-1 overflow-x-hidden overflow-y-auto bg-gray-50">
                <div class="container mx-auto px-6 py-8">
                    <!-- Visit Stats Table -->
                    <div class="bg-white rounded-lg shadow p-6 mb-8">
                        <h2 class="text-xl font-semibold mb-4 text-gray-800">Real-Time Visit Statistics</h2>
                        <div class="overflow-x-auto">
                            <table class="min-w-full divide-y divide-gray-200">
                                <thead class="bg-gray-50">
                                    <tr>
                                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Date</th>
                                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Visit Count</th>
                                    </tr>
                                </thead>
                                <tbody id="visit-stats-body" class="divide-y divide-gray-200">
                                    <tr class="bg-white" th:each="visit : ${visits}">
                                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900" th:text="${visit.date}"></td>
                                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900" th:text="${visit.count}"></td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <!-- Visit Trends Chart -->
                    <div class="bg-white rounded-lg shadow p-6 mb-8">
                        <h2 class="text-xl font-semibold mb-4 text-gray-800">Visit Trends</h2>
                        <canvas id="visitsChart"></canvas>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script th:inline="javascript">
        /*<![CDATA[*/
        const visitData = /*[[${visits}]]*/ [];
        const ctx = document.getElementById('visitsChart').getContext('2d');
        const visitsChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: visitData.map(item => item.date),
                datasets: [{
                    label: 'Daily Visits',
                    data: visitData.map(item => item.count),
                    borderColor: 'rgb(79, 70, 229)',
                    backgroundColor: 'rgba(79, 70, 229, 0.1)',
                    tension: 0.1,
                    fill: true
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: {
                        position: 'top',
                    },
                    title: {
                        display: true,
                        text: 'Website Traffic Analytics'
                    }
                },
                scales: {
                    y: {
                        beginAtZero: true,
                        title: {
                            display: true,
                            text: 'Number of Visits'
                        }
                    },
                    x: {
                        title: {
                            display: true,
                            text: 'Date'
                        }
                    }
                }
            }
        });

        // WebSocket connection and real-time update
        const socket = new SockJS('/ws');
        const stompClient = Stomp.over(socket);

        stompClient.connect({}, function () {
            stompClient.subscribe('/topic/trafficUpdates', function (message) {
                const updatedVisits = JSON.parse(message.body);
                updateVisitStatsTable(updatedVisits);
                updateChartData(updatedVisits);
            });
        });

        function updateVisitStatsTable(visits) {
            const tableBody = document.getElementById('visit-stats-body');
            tableBody.innerHTML = '';
            visits.forEach(visit => {
                const row = `<tr class="bg-white">
                                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">${visit.date}</td>
                                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">${visit.count}</td>
                             </tr>`;
                tableBody.innerHTML += row;
            });
        }

        function updateChartData(visits) {
            visitsChart.data.labels = visits.map(item => item.date);
            visitsChart.data.datasets[0].data = visits.map(item => item.count);
            visitsChart.update();
        }
        /*]]>*/
    </script>
</body>
</html>
