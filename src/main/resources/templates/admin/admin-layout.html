<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' - Admin Dashboard'">Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3B82F6',
                        secondary: '#64748B',
                        success: '#10B981',
                        warning: '#F59E0B',
                        danger: '#EF4444'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50">
    <div class="flex h-screen">
        <!-- Sidebar -->
        <div class="bg-white shadow-lg w-64 flex-shrink-0">
            <div class="p-6">
                <h1 class="text-2xl font-bold text-gray-800">Admin Panel</h1>
            </div>
            
            <nav class="mt-6">
                <div class="px-4 space-y-2">
                    <a href="/admin/dashboard" class="flex items-center px-4 py-3 text-gray-600 hover:bg-gray-50 hover:text-gray-700 rounded-lg transition-colors" th:classappend="${#httpServletRequest.requestURI == '/admin/dashboard' ? 'bg-blue-50 border-r-4 border-blue-500 text-gray-700' : ''}">
                        <i class="fas fa-tachometer-alt mr-3"></i>
                        <span>Dashboard</span>
                    </a>
                    
                    <a href="/admin/products" class="flex items-center px-4 py-3 text-gray-600 hover:bg-gray-50 hover:text-gray-700 rounded-lg transition-colors" th:classappend="${#httpServletRequest.requestURI == '/admin/products' ? 'bg-blue-50 border-r-4 border-blue-500 text-gray-700' : ''}">
                        <i class="fas fa-box mr-3"></i>
                        <span>Products</span>
                    </a>
                    
                    <a href="/admin/categories" class="flex items-center px-4 py-3 text-gray-600 hover:bg-gray-50 hover:text-gray-700 rounded-lg transition-colors" th:classappend="${#httpServletRequest.requestURI == '/admin/categories' ? 'bg-blue-50 border-r-4 border-blue-500 text-gray-700' : ''}">
                        <i class="fas fa-tags mr-3"></i>
                        <span>Categories</span>
                    </a>
                    
                    <a href="/admin/users" class="flex items-center px-4 py-3 text-gray-600 hover:bg-gray-50 hover:text-gray-700 rounded-lg transition-colors" th:classappend="${#httpServletRequest.requestURI == '/admin/users' ? 'bg-blue-50 border-r-4 border-blue-500 text-gray-700' : ''}">
                        <i class="fas fa-users mr-3"></i>
                        <span>Users</span>
                    </a>
                    
                    <a href="/admin/traffic" class="flex items-center px-4 py-3 text-gray-600 hover:bg-gray-50 hover:text-gray-700 rounded-lg transition-colors" th:classappend="${#httpServletRequest.requestURI == '/admin/traffic' ? 'bg-blue-50 border-r-4 border-blue-500 text-gray-700' : ''}">
                        <i class="fas fa-chart-line mr-3"></i>
                        <span>Traffic</span>
                    </a>
                    
                    <a href="/admin/orders" class="flex items-center px-4 py-3 text-gray-600 hover:bg-gray-50 hover:text-gray-700 rounded-lg transition-colors" th:classappend="${#httpServletRequest.requestURI == '/admin/orders' ? 'bg-blue-50 border-r-4 border-blue-500 text-gray-700' : ''}">
                        <i class="fas fa-shopping-cart mr-3"></i>
                        <span>Orders</span>
                    </a>
                    
                    <a href="/admin/revenue" class="flex items-center px-4 py-3 text-gray-600 hover:bg-gray-50 hover:text-gray-700 rounded-lg transition-colors" th:classappend="${#httpServletRequest.requestURI == '/admin/revenue' ? 'bg-blue-50 border-r-4 border-blue-500 text-gray-700' : ''}">
                        <i class="fas fa-dollar-sign mr-3"></i>
                        <span>Revenue</span>
                    </a>
                </div>
            </nav>
            
            <div class="absolute bottom-0 w-64 p-4">
                <a href="/logout" class="flex items-center px-4 py-3 text-gray-600 hover:bg-gray-50 hover:text-gray-700 rounded-lg transition-colors">
                    <i class="fas fa-sign-out-alt mr-3"></i>
                    <span>Logout</span>
                </a>
            </div>
        </div>

        <!-- Main Content -->
        <div class="flex-1 flex flex-col overflow-hidden">
            <!-- Header -->
            <header class="bg-white shadow-sm border-b border-gray-200">
                <div class="flex items-center justify-between px-6 py-4">
                    <div>
                        <h2 class="text-xl font-semibold text-gray-800" th:text="${pageTitle}">Dashboard</h2>
                        <p class="text-sm text-gray-600" th:text="${pageDescription}">Welcome back, Admin!</p>
                    </div>
                    <div class="flex items-center space-x-4">
                        <div class="relative">
                            <i class="fas fa-bell text-gray-600 text-xl"></i>
                            <span class="absolute -top-1 -right-1 bg-red-500 text-white text-xs rounded-full h-5 w-5 flex items-center justify-center">3</span>
                        </div>
                        <div class="flex items-center space-x-2">
                            <img src="/images/avatar.png" alt="Admin" class="w-8 h-8 rounded-full">
                            <span class="text-sm font-medium text-gray-700">Admin</span>
                        </div>
                    </div>
                </div>
            </header>

            <!-- Page Content -->
            <main class="flex-1 overflow-x-hidden overflow-y-auto bg-gray-50">
                <div th:replace="${content}">
                    <!-- Content will be replaced here -->
                </div>
            </main>
        </div>
    </div>
</body>
</html>
