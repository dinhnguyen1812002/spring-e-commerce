<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Quản lý Template Hóa đơn</title>

        <!-- Tailwind CSS compiled -->
        <link rel="stylesheet" th:href="@{/css/main.css}" />

        <!-- Tailwind CDN as fallback -->
        <script src="https://cdn.tailwindcss.com"></script>

        <!-- Font Awesome -->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    </head>

    <body>
        <th:block th:replace="~{layout/admin-base :: layout(
        title='Quản lý Template Hóa đơn',
        pageTitle='Quản lý Template Hóa đơn',
        pageDescription='Tạo và quản lý các mẫu hóa đơn'
    )}">
            <th:block th:fragment="content">
                <div class="space-y-6">
                    <!-- Alert Messages -->
                    <div th:if="${success}"
                        class="bg-green-50 border border-green-200 text-green-700 px-4 py-3 rounded-xl flex items-center">
                        <i class="fas fa-check-circle mr-3 text-green-500"></i>
                        <span th:text="${success}"></span>
                    </div>
                    <div th:if="${error}"
                        class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-xl flex items-center">
                        <i class="fas fa-exclamation-circle mr-3 text-red-500"></i>
                        <span th:text="${error}"></span>
                    </div>

                    <!-- Header Actions -->
                    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                        <div class="flex items-center gap-4">
                            <div
                                class="w-12 h-12 bg-gradient-to-br from-blue-500 to-blue-600 rounded-xl flex items-center justify-center">
                                <i class="fas fa-file-invoice text-white text-xl"></i>
                            </div>
                            <div>
                                <h2 class="text-xl font-bold text-gray-900">Template Hóa đơn</h2>
                                <p class="text-gray-500">Tổng cộng: <span class="font-semibold text-gray-700"
                                        th:text="${totalItems}">0</span> template</p>
                            </div>
                        </div>
                        <a href="/admin/invoice-templates/create"
                            class="inline-flex items-center px-5 py-2.5 bg-blue-600 text-white rounded-xl hover:bg-blue-700 transition-all shadow-sm hover:shadow-md font-medium">
                            <i class="fas fa-plus mr-2"></i>
                            Tạo Template mới
                        </a>
                    </div>

                    <!-- Templates Grid -->
                    <div th:if="${templates != null && templates.content != null && !#lists.isEmpty(templates.content)}"
                        class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                        <div th:each="template : ${templates}"
                            class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden hover:shadow-md transition-all group">
                            <!-- Template Header with Color Preview -->
                            <div class="h-24 relative"
                                th:style="'background: linear-gradient(135deg, ' + ${template.primaryColor ?: '#3B82F6'} + ' 0%, ' + ${template.secondaryColor ?: '#1E40AF'} + ' 100%)'">
                                <div class="absolute inset-0 bg-black/10"></div>
                                <div class="absolute top-3 right-3 flex gap-2">
                                    <span th:if="${template.isDefault}"
                                        class="px-2.5 py-1 text-xs font-medium rounded-full bg-white/90 text-blue-600 shadow-sm">
                                        <i class="fas fa-star mr-1"></i>Mặc định
                                    </span>
                                    <span th:class="${template.status.name() == 'ACTIVE' ? 'px-2.5 py-1 text-xs font-medium rounded-full bg-green-100 text-green-700' : 
                                          'px-2.5 py-1 text-xs font-medium rounded-full bg-gray-100 text-gray-600'}"
                                        th:text="${template.status}">ACTIVE</span>
                                </div>
                            </div>

                            <!-- Template Info -->
                            <div class="p-5">
                                <div class="flex items-start justify-between mb-3">
                                    <div>
                                        <h3 class="font-semibold text-gray-900 text-lg" th:text="${template.name}">
                                            Template Name</h3>
                                        <p class="text-sm text-gray-500 mt-1 line-clamp-2"
                                            th:text="${template.description ?: 'Không có mô tả'}">Description</p>
                                    </div>
                                </div>

                                <div class="flex items-center gap-4 text-sm text-gray-500 mb-4">
                                    <span class="flex items-center gap-1">
                                        <i class="fas fa-calendar-alt"></i>
                                        <span
                                            th:text="${template.createdAt != null ? #temporals.format(template.createdAt, 'dd/MM/yyyy') : '-'}">01/01/2024</span>
                                    </span>
                                    <span class="flex items-center gap-1">
                                        <i class="fas fa-user"></i>
                                        <span th:text="${template.createdBy ?: 'Admin'}">Admin</span>
                                    </span>
                                </div>

                                <!-- Actions -->
                                <div class="flex items-center justify-between pt-4 border-t border-gray-100">
                                    <div class="flex items-center gap-1">
                                        <a th:href="@{'/admin/invoice-templates/edit/' + ${template.id}}"
                                            class="p-2 text-gray-500 hover:text-blue-600 hover:bg-blue-50 rounded-lg transition-colors"
                                            title="Chỉnh sửa">
                                            <i class="fas fa-edit"></i>
                                        </a>
                                        <form th:action="@{'/admin/invoice-templates/toggle-status/' + ${template.id}}"
                                            method="post" class="inline">
                                            <input type="hidden" th:name="${_csrf.parameterName}"
                                                th:value="${_csrf.token}" />
                                            <button type="submit"
                                                th:class="${template.status.name() == 'ACTIVE' ? 'p-2 text-yellow-500 hover:text-yellow-600 hover:bg-yellow-50 rounded-lg transition-colors' : 'p-2 text-green-500 hover:text-green-600 hover:bg-green-50 rounded-lg transition-colors'}"
                                                th:title="${template.status.name() == 'ACTIVE' ? 'Vô hiệu hóa' : 'Kích hoạt'}">
                                                <i
                                                    th:class="${template.status.name() == 'ACTIVE' ? 'fas fa-toggle-on text-lg' : 'fas fa-toggle-off text-lg'}"></i>
                                            </button>
                                        </form>
                                        <form th:unless="${template.isDefault}"
                                            th:action="@{'/admin/invoice-templates/set-default/' + ${template.id}}"
                                            method="post" class="inline">
                                            <input type="hidden" th:name="${_csrf.parameterName}"
                                                th:value="${_csrf.token}" />
                                            <button type="submit"
                                                class="p-2 text-gray-500 hover:text-purple-600 hover:bg-purple-50 rounded-lg transition-colors"
                                                title="Đặt làm mặc định">
                                                <i class="far fa-star"></i>
                                            </button>
                                        </form>
                                    </div>
                                    <form th:action="@{'/admin/invoice-templates/delete/' + ${template.id}}"
                                        method="post" class="inline"
                                        onsubmit="return confirm('Bạn có chắc chắn muốn xóa template này?')">
                                        <input type="hidden" th:name="${_csrf.parameterName}"
                                            th:value="${_csrf.token}" />
                                        <button type="submit"
                                            class="p-2 text-gray-400 hover:text-red-600 hover:bg-red-50 rounded-lg transition-colors"
                                            title="Xóa">
                                            <i class="fas fa-trash"></i>
                                        </button>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Empty State -->
                    <div th:if="${templates == null || templates.content == null || #lists.isEmpty(templates.content)}"
                        class="bg-white rounded-2xl shadow-sm border border-gray-100 p-16 text-center">
                        <div class="flex flex-col items-center">
                            <div class="w-24 h-24 bg-gray-100 rounded-full flex items-center justify-center mb-6">
                                <i class="fas fa-file-invoice text-4xl text-gray-400"></i>
                            </div>
                            <h3 class="text-xl font-semibold text-gray-900 mb-2">Chưa có template nào</h3>
                            <p class="text-gray-500 mb-6 max-w-md">Tạo template hóa đơn đầu tiên để bắt đầu xuất hóa đơn
                                cho khách hàng</p>
                            <a href="/admin/invoice-templates/create"
                                class="inline-flex items-center px-6 py-3 bg-blue-600 text-white rounded-xl hover:bg-blue-700 transition-all font-medium">
                                <i class="fas fa-plus mr-2"></i>
                                Tạo Template đầu tiên
                            </a>
                        </div>
                    </div>

                    <!-- Pagination -->
                    <div th:if="${totalPages != null && totalPages > 1}" class="flex items-center justify-center gap-2">
                        <a th:if="${currentPage > 0}" th:href="@{/admin/invoice-templates(page=${currentPage - 1})}"
                            class="px-4 py-2 text-sm bg-white border border-gray-200 rounded-xl hover:bg-gray-50 transition-colors">
                            <i class="fas fa-chevron-left mr-1"></i> Trước
                        </a>
                        <div class="flex items-center gap-1">
                            <th:block th:each="i : ${#numbers.sequence(0, totalPages - 1)}">
                            <a th:href="@{/admin/invoice-templates(page=${i})}"
                               th:class="${i == currentPage ? 'px-4 py-2 text-sm bg-blue-600 text-white rounded-xl' : 'px-4 py-2 text-sm bg-white border border-gray-200 rounded-xl hover:bg-gray-50'}"
                               th:text="${i + 1}">1</a>
                        </th:block>
                    </div>
                    <a th:if="${currentPage < totalPages - 1}" th:href="@{/admin/invoice-templates(page=${currentPage + 1})}"
                       class="px-4 py-2 text-sm bg-white border border-gray-200 rounded-xl hover:bg-gray-50 transition-colors">
                        Sau <i class="fas fa-chevron-right ml-1"></i>
                    </a>
                </div>
            </div>
        </th:block>
    </th:block>
   
</body>
</html>
