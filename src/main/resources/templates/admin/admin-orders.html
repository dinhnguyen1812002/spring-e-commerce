<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý đơn hàng - Admin</title>
    <!-- Tailwind CSS compiled -->
    <link rel="stylesheet" th:href="@{/css/main.css}" />

    <!-- Tailwind CDN as fallback -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <style>
        .dropdown-menu {
            display: none;
        }

        .dropdown-menu.show {
            display: block;
        }
    </style>
</head>

<body>
    <th:block th:replace="~{layout/admin-base :: layout(
        title='Quản lý đơn hàng',
        pageTitle='Quản lý đơn hàng',
        pageDescription='Xem và quản lý tất cả đơn hàng'
    )}">
        <th:block th:fragment="content">
            <div class="space-y-6">
                <!-- Stats Cards -->
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                    <div class="bg-white rounded-2xl p-5 border border-gray-100 shadow-sm">
                        <div class="flex items-center justify-between">
                            <div>
                                <p class="text-sm text-gray-500">Tổng đơn hàng</p>
                                <p class="text-2xl font-bold text-gray-900"
                                    th:text="${orders != null ? orders.size() : 0}">0</p>
                            </div>
                            <div class="w-12 h-12 bg-blue-100 rounded-xl flex items-center justify-center">
                                <i class="fas fa-shopping-cart text-blue-600"></i>
                            </div>
                        </div>
                    </div>
                    <div class="bg-white rounded-2xl p-5 border border-gray-100 shadow-sm">
                        <div class="flex items-center justify-between">
                            <div>
                                <p class="text-sm text-gray-500">Chờ xử lý</p>
                                <p class="text-2xl font-bold text-yellow-600"
                                    th:text="${orders != null ? orders.?[orderStatus.name() == 'PENDING'].size() : 0}">
                                    0</p>
                            </div>
                            <div class="w-12 h-12 bg-yellow-100 rounded-xl flex items-center justify-center">
                                <i class="fas fa-clock text-yellow-600"></i>
                            </div>
                        </div>
                    </div>
                    <div class="bg-white rounded-2xl p-5 border border-gray-100 shadow-sm">
                        <div class="flex items-center justify-between">
                            <div>
                                <p class="text-sm text-gray-500">Hoàn thành</p>
                                <p class="text-2xl font-bold text-green-600"
                                    th:text="${orders != null ? orders.?[orderStatus.name() == 'COMPLETED'].size() : 0}">
                                    0</p>
                            </div>
                            <div class="w-12 h-12 bg-green-100 rounded-xl flex items-center justify-center">
                                <i class="fas fa-check-circle text-green-600"></i>
                            </div>
                        </div>
                    </div>
                    <div class="bg-white rounded-2xl p-5 border border-gray-100 shadow-sm">
                        <div class="flex items-center justify-between">
                            <div>
                                <p class="text-sm text-gray-500">Đã hủy</p>
                                <p class="text-2xl font-bold text-red-600"
                                    th:text="${orders != null ? orders.?[orderStatus.name() == 'CANCELLED'].size() : 0}">
                                    0</p>
                            </div>
                            <div class="w-12 h-12 bg-red-100 rounded-xl flex items-center justify-center">
                                <i class="fas fa-times-circle text-red-600"></i>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Filters -->
                <div class="bg-white rounded-2xl p-4 border border-gray-100 shadow-sm">
                    <div class="flex flex-col md:flex-row gap-4">
                        <div class="flex-1">
                            <div class="relative">
                                <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                                <input type="text" placeholder="Tìm kiếm đơn hàng..."
                                    class="w-full pl-10 pr-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                            </div>
                        </div>
                        <div class="flex gap-3">
                            <select
                                class="px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 bg-white">
                                <option value="">Tất cả trạng thái</option>
                                <option value="PENDING">Chờ xử lý</option>
                                <option value="PROCESSING">Đang xử lý</option>
                                <option value="SHIPPED">Đang giao</option>
                                <option value="COMPLETED">Hoàn thành</option>
                                <option value="CANCELLED">Đã hủy</option>
                            </select>
                            <select
                                class="px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 bg-white">
                                <option value="">Thời gian</option>
                                <option value="today">Hôm nay</option>
                                <option value="week">Tuần này</option>
                                <option value="month">Tháng này</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Orders Table -->
                <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="w-full">
                            <thead>
                                <tr class="bg-gray-50 border-b border-gray-100">
                                    <th
                                        class="px-6 py-4 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">
                                        Mã đơn</th>
                                    <th
                                        class="px-6 py-4 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">
                                        Khách hàng</th>
                                    <th
                                        class="px-6 py-4 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">
                                        Ngày đặt</th>
                                    <th
                                        class="px-6 py-4 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">
                                        Tổng tiền</th>
                                    <th
                                        class="px-6 py-4 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">
                                        Trạng thái</th>
                                    <th
                                        class="px-6 py-4 text-right text-xs font-semibold text-gray-600 uppercase tracking-wider">
                                        Thao tác</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-gray-100">
                                <tr th:each="order : ${orders}" class="hover:bg-gray-50 transition-colors">
                                    <td class="px-6 py-4">
                                        <span class="font-semibold text-gray-900"
                                            th:text="'#' + ${order.id}">#001</span>
                                    </td>
                                    <td class="px-6 py-4">
                                        <div class="flex items-center gap-3">
                                            <div class="w-9 h-9 bg-gradient-to-br from-blue-500 to-blue-600 rounded-full flex items-center justify-center text-white text-sm font-medium"
                                                th:text="${order.user.username.substring(0,1).toUpperCase()}">U
                                            </div>
                                            <div>
                                                <p class="font-medium text-gray-900" th:text="${order.user.username}">
                                                    User</p>
                                                <p class="text-sm text-gray-500" th:text="${order.user.email}">
                                                    email@example.com</p>
                                            </div>
                                        </div>
                                    </td>
                                    <td class="px-6 py-4">
                                        <p class="text-gray-900"
                                            th:text="${#temporals.format(order.orderDate, 'dd/MM/yyyy')}">01/01/2024</p>
                                        <p class="text-sm text-gray-500"
                                            th:text="${#temporals.format(order.orderDate, 'HH:mm')}">14:30</p>
                                    </td>
                                    <td class="px-6 py-4">
                                        <span class="font-semibold text-gray-900"
                                            th:text="${#numbers.formatDecimal(order.totalAmount, 0, 'COMMA', 0, 'POINT')} + ' ₫'">0
                                            ₫</span>
                                    </td>
                                    <td class="px-6 py-4">
                                        <form th:action="@{'/orders/' + ${order.id} + '/status'}" method="post"
                                            class="flex items-center gap-2">
                                            <input type="hidden" th:name="${_csrf.parameterName}"
                                                th:value="${_csrf.token}" />
                                            <select name="status"
                                                class="text-sm px-3 py-1.5 border border-gray-200 rounded-lg focus:ring-2 focus:ring-blue-500 bg-white"
                                                th:classappend="${order.orderStatus.name() == 'COMPLETED' ? 'border-green-200 bg-green-50 text-green-700' : 
                                                                     order.orderStatus.name() == 'CANCELLED' ? 'border-red-200 bg-red-50 text-red-700' : 
                                                                     order.orderStatus.name() == 'PENDING' ? 'border-yellow-200 bg-yellow-50 text-yellow-700' : ''}">
                                                <option
                                                    th:each="st : ${T(com.app.e_commerce.Enum.OrderStatus).values()}"
                                                    th:value="${st}" th:text="${st}"
                                                    th:selected="${st == order.orderStatus}"></option>
                                            </select>
                                            <button type="submit"
                                                class="p-1.5 text-blue-600 hover:bg-blue-50 rounded-lg transition-colors"
                                                title="Cập nhật">
                                                <i class="fas fa-check"></i>
                                            </button>
                                        </form>
                                    </td>
                                    <td class="px-6 py-4">
                                        <div class="flex items-center justify-end gap-1">
                                            <a th:href="@{'/admin/orders/' + ${order.id}}"
                                                class="p-2 text-gray-500 hover:text-blue-600 hover:bg-blue-50 rounded-lg transition-colors"
                                                title="Xem chi tiết">
                                                <i class="fas fa-eye"></i>
                                            </a>
                                            <div class="relative">
                                                <button type="button" onclick="toggleDropdown(this)"
                                                    class="p-2 text-gray-500 hover:text-green-600 hover:bg-green-50 rounded-lg transition-colors"
                                                    title="Xuất hóa đơn">
                                                    <i class="fas fa-file-export"></i>
                                                </button>
                                                <div
                                                    class="dropdown-menu absolute right-0 z-20 mt-2 w-40 bg-white rounded-xl shadow-lg border border-gray-100 overflow-hidden">
                                                    <a th:href="@{'/api/invoices/export/order/' + ${order.id} + '/pdf'}"
                                                        target="_blank"
                                                        class="flex items-center px-4 py-2.5 hover:bg-gray-50 text-sm text-gray-700">
                                                        <i class="fas fa-file-pdf text-red-500 mr-3"></i>Xuất PDF
                                                    </a>
                                                    <a th:href="@{'/api/invoices/export/order/' + ${order.id} + '/excel'}"
                                                        target="_blank"
                                                        class="flex items-center px-4 py-2.5 hover:bg-gray-50 text-sm text-gray-700 border-t border-gray-100">
                                                        <i class="fas fa-file-excel text-green-500 mr-3"></i>Xuất Excel
                                                    </a>
                                                    <a th:href="@{'/api/invoices/export/order/' + ${order.id} + '/csv'}"
                                                        target="_blank"
                                                        class="flex items-center px-4 py-2.5 hover:bg-gray-50 text-sm text-gray-700 border-t border-gray-100">
                                                        <i class="fas fa-file-csv text-blue-500 mr-3"></i>Xuất CSV
                                                    </a>
                                                </div>
                                            </div>
                                        </div>
                                    </td>
                                </tr>

                                <!-- Empty State -->
                                <tr th:if="${orders == null || #lists.isEmpty(orders)}">
                                    <td colspan="6" class="px-6 py-16 text-center">
                                        <div class="flex flex-col items-center">
                                            <div
                                                class="w-20 h-20 bg-gray-100 rounded-full flex items-center justify-center mb-4">
                                                <i class="fas fa-shopping-cart text-3xl text-gray-400"></i>
                                            </div>
                                            <p class="text-gray-500 text-lg mb-2">Chưa có đơn hàng nào</p>
                                            <p class="text-gray-400 text-sm">Đơn hàng mới sẽ xuất hiện ở đây</p>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <!-- Pagination -->
                    <div th:if="${orders != null && !#lists.isEmpty(orders)}"
                        class="px-6 py-4 border-t border-gray-100 bg-gray-50">
                        <div class="flex items-center justify-between">
                            <p class="text-sm text-gray-600">
                                Hiển thị <span class="font-medium" th:text="${orders.size()}">0</span> đơn hàng
                            </p>
                            <div class="flex gap-2">
                                <button
                                    class="px-3 py-1.5 text-sm border border-gray-200 rounded-lg hover:bg-white disabled:opacity-50"
                                    disabled>
                                    <i class="fas fa-chevron-left mr-1"></i> Trước
                                </button>
                                <button
                                    class="px-3 py-1.5 text-sm border border-gray-200 rounded-lg hover:bg-white disabled:opacity-50"
                                    disabled>
                                    Sau <i class="fas fa-chevron-right ml-1"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <script>
                function toggleDropdown(btn) {
                    // Close all other dropdowns
                    document.querySelectorAll('.dropdown-menu.show').forEach(function (menu) {
                        if (menu !== btn.nextElementSibling) {
                            menu.classList.remove('show');
                        }
                    });
                    // Toggle current dropdown
                    var menu = btn.nextElementSibling;
                    menu.classList.toggle('show');
                }

                // Close dropdown when clicking outside
                document.addEventListener('click', function (e) {
                    if (!e.target.closest('.relative')) {
                        document.querySelectorAll('.dropdown-menu.show').forEach(function (menu) {
                            menu.classList.remove('show');
                        });
                    }
                });
            </script>
        </th:block>
    </th:block>

    <script>
        // Toggle sidebar for mobile
        function toggleSidebar() {
            var sidebar = document.getElementById('sidebar');
            var backdrop = document.getElementById('sidebarBackdrop');

            if (sidebar.classList.contains('-translate-x-full')) {
                sidebar.classList.remove('-translate-x-full');
                sidebar.classList.add('translate-x-0');
                backdrop.classList.remove('hidden');
            } else {
                sidebar.classList.add('-translate-x-full');
                sidebar.classList.remove('translate-x-0');
                backdrop.classList.add('hidden');
            }
        }

        // Toggle dropdown menus
        function toggleDropdown(dropdownId) {
            var dropdown = document.getElementById(dropdownId);

            // Close all other dropdowns first
            document.querySelectorAll('[id$="Dropdown"]').forEach(function (el) {
                if (el.id !== dropdownId) {
                    el.classList.add('dropdown-hidden');
                }
            });

            // Toggle current dropdown
            dropdown.classList.toggle('dropdown-hidden');
        }

        // Close dropdowns when clicking outside
        document.addEventListener('click', function (e) {
            var notificationBtn = document.getElementById('notificationBtn');
            var userMenuBtn = document.getElementById('userMenuBtn');
            var notificationDropdown = document.getElementById('notificationDropdown');
            var userMenuDropdown = document.getElementById('userMenuDropdown');

            // Close notification dropdown if clicking outside
            if (notificationDropdown && !notificationDropdown.contains(e.target) && !notificationBtn.contains(e.target)) {
                notificationDropdown.classList.add('dropdown-hidden');
            }

            // Close user menu dropdown if clicking outside
            if (userMenuDropdown && !userMenuDropdown.contains(e.target) && !userMenuBtn.contains(e.target)) {
                userMenuDropdown.classList.add('dropdown-hidden');
            }
        });
    </script>
</body>

</html>
