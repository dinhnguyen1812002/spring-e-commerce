<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Danh mục sản phầm</title>
    <!-- Thêm Tailwind CSS qua CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <th:block th:replace="~{Layout :: link-css}"></th:block>
</head>
<body class="bg-gray-100 min-h-screen">
<div th:replace="~{fragments/header :: header}"></div>

<div class="container mx-auto mt-10 px-4 sm:px-6 lg:px-8">
    <div class="flex justify-between items-center mb-6">
        <h1 class="text-2xl font-bold text-gray-900">Categories</h1>
        <a href="/categories/new-category"
           class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition duration-200 text-sm font-medium">
            Add New Category
        </a>
    </div>

    <div class="overflow-x-auto bg-white rounded-lg shadow">
        <table class="min-w-full divide-y divide-gray-200">
            <thead class="bg-gray-50">
            <tr>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">ID</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Name</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
            </tr>
            </thead>
            <tbody class="divide-y divide-gray-200">
            <tr th:each="category : ${categories}" class="hover:bg-gray-50">
                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900" th:text="${category.id}"></td>
                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900" th:text="${category.name}"></td>
                <td class="px-6 py-4 whitespace-nowrap text-sm">
                    <a th:href="@{/categories/edit/{id}(id=${category.id})}"
                       class="text-blue-600 hover:text-blue-800 font-medium mr-4">Edit</a>
                    <a th:href="@{/categories/delete/{id}(id=${category.id})}"
                       class="text-red-600 hover:text-red-800 font-medium"
                       onclick="return confirm('Are you sure you want to delete this category?');">Delete</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
<script th:src="@{/js/toggle.js}" th:fragment="common-js"></script>
</body>
</html>
