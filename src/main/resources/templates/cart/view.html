<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" class="h-full bg-gray-100">
<head>
    <title>Giỏ hàng</title>
    <th:block th:replace="~{Layout :: link-css}"></th:block>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"/>
</head>
<body class="h-full bg-white">
<div th:replace="~{fragments/header :: header}"></div>
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 bg-white">
    <h2 class="text-3xl font-extrabold text-gray-900 mb-8 text-center">Giỏ hàng của bạn</h2>
<!-- Progress Bar -->
<div class="max-w-3xl mx-auto mt-6 mb-8">
    <ol class="flex items-center w-full text-sm font-medium text-center text-gray-500">
        <li class="flex-1 flex items-center">
            <span class="flex items-center justify-center w-8 h-8 rounded-full bg-indigo-600 text-white">1</span>
            <span class="ml-2 font-semibold text-indigo-700">Giỏ hàng</span>
            <span class="flex-1 h-1 bg-indigo-300 mx-2"></span>
        </li>
        <li class="flex-1 flex items-center">
            <span class="flex items-center justify-center w-8 h-8 rounded-full bg-gray-200">2</span>
            <span class="ml-2">Địa chỉ</span>
            <span class="flex-1 h-1 bg-gray-200 mx-2"></span>
        </li>
        <li class="flex-1 flex items-center">
            <span class="flex items-center justify-center w-8 h-8 rounded-full bg-gray-200">3</span>
            <span class="ml-2">Thanh toán</span>
            <span class="flex-1 h-1 bg-gray-200 mx-2"></span>
        </li>
        <li class="flex items-center">
            <span class="flex items-center justify-center w-8 h-8 rounded-full bg-gray-200">4</span>
            <span class="ml-2">Xác nhận</span>
        </li>
    </ol>
</div>

<div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
    <!-- Nút tiếp tục mua sắm -->
    <div class="mb-4 flex justify-end">
        <a href="/" class="inline-flex items-center px-5 py-2 bg-white border border-indigo-600 text-indigo-600 rounded-md shadow hover:bg-indigo-50 transition">
            <i class="fa-solid fa-arrow-left mr-2"></i> Tiếp tục mua sắm
        </a>
    </div>
    <div class="flex flex-col lg:flex-row gap-8">
        <!-- Cart Items -->
        <div class="w-full lg:w-2/3">
            <!-- Empty Cart -->
            <div th:if="${cart.cartItems.size() == 0}" class="bg-white shadow rounded-lg flex flex-col items-center py-16">
                <i class="fa-solid fa-cart-shopping text-6xl text-gray-300 mb-4"></i>
                <p class="text-xl text-gray-700 mb-4">Giỏ hàng của bạn đang trống.</p>
                <a href="/" class="inline-block px-6 py-2 bg-indigo-600 text-white rounded-md shadow hover:bg-indigo-700 transition">Tiếp tục mua sắm</a>
            </div>
            <!-- Cart List -->
            <div th:if="${cart.cartItems.size() > 0}" class="space-y-6">
                <div th:each="item : ${cart.cartItems}" class="bg-white shadow rounded-lg flex flex-col sm:flex-row items-center p-4 gap-6">
                    <!-- Product Image -->
                    <img th:src="${item.product.image}" alt="Product image" class="w-32 h-32 object-cover rounded-lg border">
                    <!-- Product Info -->
                    <div class="flex-grow w-full sm:w-auto">
                        <h3 th:text="${item.product.name}" class="text-lg font-bold text-gray-900 mb-2"></h3>
                        <div class="flex items-center text-gray-500 text-sm mb-2">
                            <span>Số lượng:</span>
                            <form th:action="@{/cart/update}" method="post" class="ml-2">
                                <input type="hidden" name="productId" th:value="${item.product.id}"/>
                                <input type="number" name="quantity" th:value="${item.quantity}"
                                       class="w-16 rounded border-gray-300 shadow-sm focus:border-indigo-300 focus:ring focus:ring-indigo-200 focus:ring-opacity-50 px-2 py-1"
                                       min="1" onchange="this.form.submit()"/>
                            </form>
                        </div>
                        <span th:text="${#numbers.formatDecimal(item.product.price, 0, 'COMMA', 0, 'POINT')} + ' VND'" class="text-base font-semibold text-indigo-700"></span>
                    </div>
                    <!-- Remove/Edit Buttons -->
                    <div class="flex flex-col gap-2 ml-auto">
                        <form th:action="@{/cart/remove}" method="post">
                            <input type="hidden" name="productId" th:value="${item.product.id}"/>
                            <button type="submit" class="w-10 h-10 flex items-center justify-center bg-red-100 hover:bg-red-200 rounded-full text-red-600" title="Xóa">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </form>
                        <!-- Nút chỉnh sửa có thể mở modal (giả lập) -->
                        <!-- <button class="w-10 h-10 flex items-center justify-center bg-gray-100 hover:bg-gray-200 rounded-full text-gray-600" title="Chỉnh sửa">
                            <i class="fa-solid fa-pen"></i>
                        </button> -->
                    </div>
                </div>
            </div>
            <!-- Đề xuất sản phẩm liên quan (giả lập) -->
            <div th:if="${cart.cartItems.size() > 0}" class="mt-10">
                <h4 class="text-lg font-semibold text-gray-800 mb-4">Có thể bạn sẽ thích</h4>
                <div class="grid grid-cols-2 md:grid-cols-3 gap-4">
                    <div class="bg-white rounded-lg shadow p-3 flex flex-col items-center" th:each="prod : ${relatedProducts}">
                        <img th:src="${prod.image}" alt="Ảnh sản phẩm" class="w-20 h-20 object-cover rounded mb-2">
                        <div th:text="${prod.name}" class="text-sm font-medium text-gray-700 mb-1"></div>
                        <div th:text="${#numbers.formatDecimal(prod.price, 0, 'COMMA', 0, 'POINT')} + ' VND'" class="text-xs text-indigo-600 mb-2"></div>
                        <form th:action="@{/cart/add}" method="post">
                            <input type="hidden" name="productId" th:value="${prod.id}"/>
                            <button type="submit" class="px-3 py-1 bg-indigo-600 text-white rounded text-xs hover:bg-indigo-700">Thêm vào giỏ</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
        <!-- Order Summary -->
        <div class="w-full lg:w-1/3">
            <div th:if="${cart.cartItems.size() > 0}" class="bg-white shadow-lg rounded-lg p-8 sticky top-8">
                <h3 class="text-lg font-bold text-gray-900 mb-6 text-center">Tóm tắt đơn hàng</h3>
                <div class="flex justify-between mb-2">
                    <span>Tổng phụ:</span>
                    <span th:text="${#numbers.formatDecimal(cart.totalPrice, 0, 'COMMA', 0, 'POINT')} + ' VND'"></span>
                </div>
                <div class="flex justify-between mb-2">
                    <span>Phí vận chuyển:</span>
                    <span>20,000 VND</span>
                </div>
                <div class="flex justify-between mb-2">
                    <span>Thuế (10%):</span>
                    <span th:text="${#numbers.formatDecimal(cart.totalPrice * 0.1, 0, 'COMMA', 0, 'POINT')} + ' VND'"></span>
                </div>
                <div class="border-t my-4"></div>
                <div class="flex justify-between text-lg font-bold">
                    <span>Tổng cộng:</span>
                    <span th:text="${#numbers.formatDecimal(cart.totalPrice + 20000 + cart.totalPrice * 0.1, 0, 'COMMA', 0, 'POINT')} + ' VND'"></span>
                </div>
                <!-- <form method="get" th:action="@{/cart/checkout}" class="mt-6"> -->
                    <a href="/orders/checkout"
                            class="w-full flex justify-center py-3 px-4 border border-transparent rounded-md shadow-sm text-base font-semibold text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition">
                        Thanh toán
                    </a>
                <!-- </form> -->
            </div>
        </div>
    </div>
</div>

</div>


<div th:replace="~{fragments/footer :: footer}"></div>
<script th:src="@{/js/toggle.js}" th:fragment="common-js"></script>
</body>
</html>
