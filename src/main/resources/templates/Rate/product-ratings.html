<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <style>
        .rating-animate {
            animation: fadeIn 0.5s ease-in;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
<div th:fragment="ratings-section(product)" class="max-w-7xl mx-auto p-4">
    <h2 class="text-2xl font-bold mb-4 text-gray-800">Customer Reviews</h2>
    <div th:if="${#authorization.expression('isAuthenticated()')}" class="mt-6">
        <form th:action="@{/ratings/add}" method="post" class="bg-white p-6 rounded-lg shadow-md border border-gray-200">
            <input type="hidden" name="productId" th:value="${product.id}"/>
            <div class="mb-4">
                <label for="comment" class="block text-sm font-medium text-gray-700">Your Comment</label>
                <textarea id="comment" name="comment" required rows="4" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500"></textarea>
            </div>
            <div class="mb-4">
                <label for="star" class="block text-sm font-medium text-gray-700">Rating</label>
                <select id="star" name="star" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500">
                    <option value="1">1 Star</option>
                    <option value="2">2 Stars</option>
                    <option value="3">3 Stars</option>
                    <option value="4">4 Stars</option>
                    <option value="5">5 Stars</option>
                </select>
            </div>
            <button type="submit" class="w-full bg-indigo-600 text-white py-2 px-4 rounded-md hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500">Submit Rating</button>
        </form>
    </div>
    <div id="ratings-list" class="space-y-4">
        <div th:each="rate : ${product.rates}" class="bg-white p-4 rounded-lg shadow-md border border-gray-200">
            <div class=" flex items-center ">
                <div>

                </div>
                <div class="flex items-center">
                    <span th:each="i : ${#numbers.sequence(1, rate.star)}" class="text-yellow-400">★</span>
                    <span th:each="i : ${#numbers.sequence(rate.star + 1, 5)}" class="text-gray-300">★</span>
                </div>
            </div>
            <p class="text-gray-700 mt-2" th:text="${rate.comment}"></p>
            <p class="text-sm text-gray-500 mt-1" 
               th:text="${T(com.app.e_commerce.util.TimeAgoUtil).getTimeAgo(rate.createdAt)}"></p>
        </div>
    </div>


    <div th:unless="${#authorization.expression('isAuthenticated()')}" class="mt-6 text-center">
        <p class="text-gray-600">Please <a th:href="@{/login}" class="text-indigo-600 hover:underline">log in</a> to leave a review.</p>
    </div>

    <script th:inline="javascript">
        /*<![CDATA[*/
        const productId = [[${product.id}]];
        const socket = new SockJS('/ws');
        const stompClient = Stomp.over(socket);

        stompClient.connect({}, function (frame) {
            console.log('Connected: ' + frame);
            stompClient.subscribe('/topic/ratings/' + productId, function (message) {
                const rating = JSON.parse(message.body);
                const ratingsList = document.getElementById('ratings-list');
                const newRating = document.createElement('div');
                newRating.className = 'bg-white p-4 rounded-lg shadow-md border border-gray-200 rating-animate';
                newRating.innerHTML = `
                    <div class="flex items-center justify-between">
                        <p class="font-semibold text-gray-900">${rating.username}</p>
                        <div class="flex items-center">
                            ${'<span class="text-yellow-400">★</span>'.repeat(rating.star)}
                            ${'<span class="text-gray-300">★</span>'.repeat(5 - rating.star)}
                        </div>
                    </div>
                    <p class="text-gray-700 mt-2">${rating.comment}</p>
                    <p class="text-sm text-gray-500 mt-1">
                        ${new Date(rating.createdAt).toLocaleString().split(',').length > 1 ? 
                          new Date(rating.createdAt).toLocaleString().split(',')[0] + ' ' + 
                          new Date(rating.createdAt).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : 
                          'Just now'}
                    </p>`;
                ratingsList.prepend(newRating);
            });
        });

        window.onunload = function () {
            if (stompClient !== null) {
                stompClient.disconnect();
                console.log('Disconnected');
            }
        };
        /*]]>*/
    </script>
</body>
</html>
