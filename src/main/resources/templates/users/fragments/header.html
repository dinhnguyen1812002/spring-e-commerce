<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
</head>

<body>
    <header th:fragment="header" class="bg-white border-b border-gray-200 sticky top-0 z-30">
        <div class="px-4 h-16 flex items-center justify-between">
            <!-- Left: Sidebar Toggle (Mobile) -->
            <div class="flex items-center">
                <button @click="sidebarOpen = !sidebarOpen"
                    class="p-2 rounded-md text-gray-500 lg:hidden hover:bg-gray-100 focus:outline-none">
                    <i class="fa-solid fa-bars text-xl"></i>
                </button>
                <div class="ml-4 lg:ml-0">
                    <h1
                        class="text-xl font-bold bg-gradient-to-r from-blue-600 to-indigo-600 bg-clip-text text-transparent">
                        USER DASHBOARD
                    </h1>
                </div>
            </div>

            <!-- Right: User Menu -->
            <div class="flex items-center gap-4">
                <!-- Notifications -->
                <div class="relative" x-data="{ open: false }">
                    <button @click="open = !open"
                        class="p-2 text-gray-500 hover:text-blue-600 hover:bg-blue-50 rounded-full transition-colors relative">
                        <i class="fa-regular fa-bell text-xl"></i>
                        <span
                            class="absolute top-1 right-1 w-2 h-2 bg-red-500 rounded-full border-2 border-white"></span>
                    </button>
                    <!-- Notification Dropdown -->
                    <div x-show="open" @click.away="open = false" x-transition:enter="transition ease-out duration-100"
                        x-transition:enter-start="transform opacity-0 scale-95"
                        x-transition:enter-end="transform opacity-100 scale-100"
                        class="absolute right-0 mt-2 w-72 bg-white rounded-lg shadow-xl border border-gray-100 py-2 z-50">
                        <div class="px-4 py-2 border-b border-gray-50 flex justify-between items-center">
                            <span class="font-semibold text-gray-800">Thông báo</span>
                            <span class="text-xs text-blue-600 hover:underline cursor-pointer">Đánh dấu đã đọc</span>
                        </div>
                        <div class="max-h-64 overflow-y-auto">
                            <div class="px-4 py-3 hover:bg-gray-50 cursor-pointer border-b border-gray-50">
                                <p class="text-sm text-gray-800 font-medium">Đơn hàng #123 đã được giao</p>
                                <p class="text-xs text-gray-500 mt-1">2 giờ trước</p>
                            </div>
                            <div class="px-4 py-3 hover:bg-gray-50 cursor-pointer border-b border-gray-50">
                                <p class="text-sm text-gray-800">Chào mừng bạn trở lại!</p>
                                <p class="text-xs text-gray-500 mt-1">Hôm nay</p>
                            </div>
                        </div>
                        <div class="px-4 py-2 text-center border-t border-gray-50">
                            <a href="#" class="text-sm text-gray-600 hover:text-blue-600">Xem tất cả</a>
                        </div>
                    </div>
                </div>

                <!-- User Dropdown -->
                <div class="relative" x-data="{ open: false }">
                    <button @click="open = !open"
                        class="flex items-center gap-2 p-1.5 hover:bg-gray-100 rounded-lg transition-all border border-transparent hover:border-gray-200">
                        <img th:src="@{/users/{id}/avatar(id=${user != null ? user.id : ''})}" alt="Avatar"
                            class="w-8 h-8 rounded-full border border-gray-200 object-cover"
                            onerror="this.src='/images/default-avatar.png'">
                        <span class="hidden md:block text-sm font-medium text-gray-700"
                            th:text="${user != null ? user.username : 'User'}">User</span>
                        <i class="fa-solid fa-chevron-down text-xs text-gray-400"></i>
                    </button>

                    <div x-show="open" @click.away="open = false" x-transition:enter="transition ease-out duration-100"
                        x-transition:enter-start="transform opacity-0 scale-95"
                        x-transition:enter-end="transform opacity-100 scale-100"
                        class="absolute right-0 mt-2 w-56 bg-white rounded-lg shadow-xl border border-gray-100 py-2 z-50">
                        <div class="px-4 py-3 border-b border-gray-50">
                            <p class="text-sm text-gray-500">Xin chào,</p>
                            <p class="text-sm font-semibold text-gray-800 truncate"
                                th:text="${user != null ? user.email : 'user@example.com'}">
                                user@example.com</p>
                        </div>
                        <a th:href="@{/users/edit/{id}(id=${user != null ? user.id : '00000000-0000-0000-0000-000000000000'})}"
                            class="flex items-center gap-3 px-4 py-2.5 text-sm text-gray-600 hover:bg-blue-50 hover:text-blue-600 transition-colors">
                            <i class="fa-regular fa-user w-5"></i>
                            Hồ sơ cá nhân
                        </a>
                        <a href="#"
                            class="flex items-center gap-3 px-4 py-2.5 text-sm text-gray-600 hover:bg-blue-50 hover:text-blue-600 transition-colors">
                            <i class="fa-solid fa-gear w-5"></i>
                            Cài đặt
                        </a>
                        <div class="border-t border-gray-50 my-1"></div>
                        <a th:href="@{/logout}"
                            class="flex items-center gap-3 px-4 py-2.5 text-sm text-red-600 hover:bg-red-50 transition-colors">
                            <i class="fa-solid fa-arrow-right-from-bracket w-5"></i>
                            Đăng xuất
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </header>
</body>

</html>
