<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
</head>

<body>
<aside th:fragment="sidebar"
       class="fixed inset-y-0 left-0 bg-white border-r border-gray-200 w-64 transform transition-transform duration-300 lg:translate-x-0 z-40"
       :class="sidebarOpen ? 'translate-x-0' : '-translate-x-full'">
    <div class="flex flex-col h-full">
        <!-- Sidebar Brand -->
        <div class="p-6 border-b border-gray-50 flex items-center justify-between">
            <a th:href="@{/}" class="flex items-center gap-2">
                <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center">
                    <i class="fa-solid fa-cart-shopping text-white text-sm"></i>
                </div>
                <span class="font-bold text-gray-800">E-SHOP</span>
            </a>
            <button @click="sidebarOpen = false" class="lg:hidden text-gray-500 hover:text-gray-800">
                <i class="fa-solid fa-xmark text-xl"></i>
            </button>
        </div>

        <!-- Navigation Links -->
        <nav class="flex-1 overflow-y-auto py-6 px-4 space-y-1.5 focus:outline-none">
            <p class="text-xs font-semibold text-gray-400 uppercase tracking-wider px-3 mb-2">Chính</p>

            <a th:href="@{/users/dashboard}"
               class="flex items-center gap-3 px-3 py-2.5 rounded-lg transition-all group"
               th:classappend="${#ctx.request != null && #ctx.request.requestURI == '/users/dashboard'} ? 'bg-blue-600 text-white shadow-lg shadow-blue-200' : 'text-gray-600 hover:bg-gray-50 hover:text-blue-600'">
                <i class="fa-solid fa-house-chimney w-5 text-center group-hover:scale-110 transition-transform"></i>
                <span class="font-medium">Tổng quan</span>
            </a>

            <a th:href="@{/orders}" class="flex items-center gap-3 px-3 py-2.5 rounded-lg transition-all group"
               th:classappend="${#ctx.request != null && #ctx.request.requestURI.startsWith('/orders')} ? 'bg-blue-600 text-white shadow-lg shadow-blue-200' : 'text-gray-600 hover:bg-gray-50 hover:text-blue-600'">
                <i class="fa-solid fa-bag-shopping w-5 text-center group-hover:scale-110 transition-transform"></i>
                <span class="font-medium">Đơn hàng của tôi</span>
            </a>

            <p class="text-xs font-semibold text-gray-400 uppercase tracking-wider px-3 mt-8 mb-2">Tài khoản</p>

            <a th:href="@{/users/edit/{id}(id=${user.id})}"
               class="flex items-center gap-3 px-3 py-2.5 rounded-lg transition-all group text-gray-600 hover:bg-gray-50 hover:text-blue-600">
                <i class="fa-solid fa-user-pen w-5 text-center group-hover:scale-110 transition-transform"></i>
                <span class="font-medium">Sửa hồ sơ</span>
            </a>

            <a href="#"
               class="flex items-center gap-3 px-3 py-2.5 rounded-lg transition-all group text-gray-600 hover:bg-gray-50 hover:text-blue-600">
                <i class="fa-solid fa-heart w-5 text-center group-hover:scale-110 transition-transform"></i>
                <span class="font-medium">Sản phẩm yêu thích</span>
            </a>

            <a href="#"
               class="flex items-center gap-3 px-3 py-2.5 rounded-lg transition-all group text-gray-600 hover:bg-gray-50 hover:text-blue-600">
                <i class="fa-solid fa-location-dot w-5 text-center group-hover:scale-110 transition-transform"></i>
                <span class="font-medium">Địa chỉ nhận hàng</span>
            </a>
        </nav>

        <!-- Bottom Actions -->
        <div class="p-4 border-t border-gray-100">
            <a th:href="@{/logout}"
               class="flex items-center justify-center gap-2 w-full py-2.5 text-red-600 bg-red-50 hover:bg-red-100 rounded-lg transition-colors font-medium">
                <i class="fa-solid fa-arrow-right-from-bracket"></i>
                Đăng xuất
            </a>
        </div>
    </div>
</aside>
</body>

</html>
