<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lịch sử đơn hàng</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <th:block th:replace="~{Layout :: link-css}"></th:block>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: {
                50: '#f0f9ff',
                500: '#3b82f6',
                600: '#2563eb',
                700: '#1d4ed8',
              }
            }
          }
        }
      }
    </script>
  </head>

  <body class="bg-gray-50 min-h-screen">
    <div th:replace="~{fragments/header :: header}"></div>

    <div class="flex min-h-screen">
      <!-- Sidebar -->
      <aside class="flex-shrink-0">
        <div th:replace="~{fragments/profile-sidebar :: profile-sidebar}"></div>
      </aside>

      <!-- Main Content -->
      <div class="flex-1 min-w-0 p-6 lg:p-10 overflow-x-hidden">
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-8 gap-4">
          <h1 class="text-3xl font-bold text-gray-800">Lịch sử đơn hàng</h1>
          <div class="flex space-x-4">
            <select
              class="px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
              <option value="all">Tất cả đơn hàng</option>
              <option value="pending">Đang xử lý</option>
              <option value="success">Hoàn thành</option>
              <option value="cancelled">Đã hủy</option>
            </select>
          </div>
        </div>

        <!-- Orders List -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
          <div class="overflow-x-auto">
            <table class="min-w-full divide-y divide-gray-200">
              <thead class="bg-gray-50">
                <tr>
                  <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Mã đơn hàng
                  </th>
                  <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Ngày đặt
                  </th>
                  <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Sản phẩm
                  </th>
                  <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Trạng thái
                  </th>
                  <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Tổng tiền
                  </th>
                  <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Thao tác
                  </th>
                </tr>
              </thead>
              <tbody class="bg-white divide-y divide-gray-200">
                <tr th:each="order : ${orders}" class="hover:bg-gray-50">
                  <td class="px-6 py-4 whitespace-nowrap">
                    <span class="text-sm font-medium text-gray-900" th:text="'#' + ${order.id}">Order ID</span>
                  </td>
                  <td class="px-6 py-4 whitespace-nowrap">
                    <span class="text-sm text-gray-500" th:text="${#temporals.format(order.orderDate, 'dd/MM/yyyy')}">Date</span>
                                </td>
                                <td class="px-6 py-4">
                                    <div class="text-sm text-gray-900">
                                        <span th:text="${order.orderItems != null ? #lists.size(order.orderItems) : 0} + ' sản phẩm'">Items Count</span>
                                    </div>
                                </td>
                                <td class="px-6 py-4 whitespace-nowrap">
                                    <span th:class="${order.orderStatus.name() == 'SUCCESS' || order.orderStatus.name() == 'COMPLETED' ? 'bg-green-100 text-green-800' :
                                                     order.orderStatus.name() == 'PENDING' ? 'bg-yellow-100 text-yellow-800' :
                                                     order.orderStatus.name() == 'CANCELLED' ? 'bg-red-100 text-red-800' :
                                                     'bg-blue-100 text-blue-800'}"
                                          class="px-2 py-1 inline-flex text-xs leading-5 font-semibold rounded-full"
                                          th:text="${order.orderStatus}">Status</span>
                                </td>
                                <td class="px-6 py-4 whitespace-nowrap">
                                    <span class="text-sm font-medium text-gray-900" th:text="${#numbers.formatDecimal(order.totalAmount, 0, 'COMMA', 0, 'POINT')} + ' VND'">Total</span>
                                </td>
                                <td class="px-6 py-4 whitespace-nowrap text-sm font-medium">
                                    <a th:href="@{/orders/{id}(id=${order.id})}" class="text-blue-600 hover:text-blue-900">Xem chi tiết</a>
                                </td>
                            </tr>
                            <!-- Empty State -->
                            <tr th:if="${orders == null || #lists.isEmpty(orders)}">
                                <td colspan="6" class="px-6 py-12 text-center">
                                    <div class="flex flex-col items-center">
                                        <i class="fas fa-shopping-bag text-4xl text-gray-300 mb-4"></i>
                                        <p class="text-gray-500 mb-4">Chưa có đơn hàng nào</p>
                                        <a href="/" class="inline-flex items-center px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">
                                            <i class="fas fa-plus mr-2"></i>
                                            Bắt đầu mua sắm
                                        </a>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- Pagination -->
                <div th:if="${orders != null && !#lists.isEmpty(orders)}" class="bg-gray-50 px-4 py-3 flex items-center justify-between border-t border-gray-200 sm:px-6">
                    <div class="hidden sm:flex-1 sm:flex sm:items-center sm:justify-between">
                        <div>
                            <p class="text-sm text-gray-700">
                                Hiển thị <span class="font-medium" th:text="${#lists.size(orders)}">0</span> đơn hàng
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <script th:src="@{/js/toggle.js}"></script>
</body>
</html>
