<html lang="en" xmlns:th="http://www.thymeleaf.org"

    <meta charset="UTF-8">
    <title>Title</title>
    <th:block th:replace="~{Layout :: link-css}"></th:block>
    <style>
        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
        }
    </style>
</head>
<body>

    <div class="bg-white shadow-lg w-64 flex-shrink-0" th:fragment="sidebar">
        <div class="p-6">
            <h1 class="text-2xl font-bold text-gray-800">
                <a th:href="@{/}">
                    Admin Panel
                </a>
            </h1>
        </div>
        
        <nav class="mt-6">
            <div class="px-4 space-y-2">
                 <a th:href="@{/admin/dashboard}" class="flex items-center px-4 py-3 text-gray-600 hover:bg-gray-50 hover:text-gray-700 rounded-lg transition-colors">
                    <i class="fas fa-tachometer-alt mr-3"></i>
                    <span>Dashboard</span>
                </a>
                
                <a href="/admin/products" class="flex items-center px-4 py-3 text-gray-600 hover:bg-gray-50 hover:text-gray-700 rounded-lg transition-colors">
                    <i class="fas fa-box mr-3"></i>
                    <span>Products</span>
                </a>
                
                <a href="/admin/categories" class="flex items-center px-4 py-3 text-gray-700 bg-blue-50 border-r-4 border-blue-500 rounded-lg">
                    <i class="fas fa-tags mr-3"></i>
                    <span>Categories</span>
                </a>
                
                <a href="/admin/users" class="flex items-center px-4 py-3 text-gray-600 hover:bg-gray-50 hover:text-gray-700 rounded-lg transition-colors">
                    <i class="fas fa-users mr-3"></i>
                    <span>Users</span>
                </a>
                
                <a href="/admin/traffic" class="flex items-center px-4 py-3 text-gray-600 hover:bg-gray-50 hover:text-gray-700 rounded-lg transition-colors">
                    <i class="fas fa-chart-line mr-3"></i>
                    <span>Traffic</span>
                </a>
                
                <a href="/admin/orders" class="flex items-center px-4 py-3 text-gray-600 hover:bg-gray-50 hover:text-gray-700 rounded-lg transition-colors">
                    <i class="fas fa-shopping-cart mr-3"></i>
                    <span>Orders</span>
                </a>
                
                <a href="/admin/revenue" class="flex items-center px-4 py-3 text-gray-600 hover:bg-gray-50 hover:text-gray-700 rounded-lg transition-colors">
                    <i class="fas fa-dollar-sign mr-3"></i>
                    <span>Revenue</span>
                </a>
            </div>
        </nav>
        
        <div class="absolute bottom-0 w-64 p-4">
            <a href="/logout" class="flex items-center px-4 py-3 text-gray-600 hover:bg-gray-50 hover:text-gray-700 rounded-lg transition-colors">
                <i class="fas fa-sign-out-alt mr-3"></i>
                <span>Logout</span>
            </a>
        </div>
    </div>

    <div th:fragment="profile-sidebar" class="w-64 bg-white h-screen flex flex-col border-r shadow-sm">
        <!-- Header -->
        <div class="p-6 border-b">
            <h2 class="text-2xl font-bold text-gray-800">Dashboard</h2>
        </div>

        <!-- Navigation -->
        <nav class="mt-6 flex-1">
            <a th:href="@{/users/edit/{id}(id=${#authentication.principal.id})}"
               class="block py-3 px-6 text-gray-600 hover:bg-gray-100 hover:text-gray-900">Profile</a>
            <a th:href="@{/orders}"
               class="block py-3 px-6 text-gray-600 hover:bg-gray-100 hover:text-gray-900">Orders</a>
            <a href="#"
               class="block py-3 px-6 text-gray-600 hover:bg-gray-100 hover:text-gray-900">Settings</a>
        </nav>

        <!-- User Section at Bottom -->
        <div x-data="{ open: false }" class="border-t p-4 relative">
            <!-- Avatar + Name -->
            <button @click="open = !open"
                    class="flex items-center gap-3 w-full text-left hover:bg-gray-100 px-2 py-2 rounded-md">
                <img th:src="'data:image/jpeg;base64,' + ${#authentication.principal.avatar}"
                     alt="User Avatar" class="w-10 h-10 rounded-full object-cover border"/>
                <span class="font-medium text-gray-800" th:text="${#authentication.name}"></span>
                <i class="fa-solid fa-chevron-down ml-auto text-gray-500"></i>
            </button>

            <!-- Dropdown -->
            <div x-show="open" @click.away="open = false"
                 class="absolute bottom-16 left-4 right-4 bg-white shadow-lg rounded-md overflow-hidden border z-50">
                <a th:href="@{/users/edit/{id}(id=${#authentication.principal.id})}"
                   class="block px-4 py-2 text-gray-600 hover:bg-gray-100">Tài khoản của tôi</a>
                <a href="#" class="block px-4 py-2 text-gray-600 hover:bg-gray-100">Cài đặt</a>
                <a th:href="@{/logout}"
                   class="block px-4 py-2 text-red-600 hover:bg-red-100">Đăng xuất</a>
            </div>
        </div>
    </div>

    <!-- Alpine.js (nhẹ, chỉ 7kb) -->
    <script src="//unpkg.com/alpinejs" defer></script>

</body>
