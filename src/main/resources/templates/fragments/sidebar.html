<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
        }
        .nav-active {
            color: #1d4ed8;
            background-color: #eff6ff;
        }
        .nav-active i {
            color: #1d4ed8 !important;
        }
    </style>
</head>
<body>
<div class="flex flex-col h-full bg-white border-r border-gray-200" th:fragment="sidebar">
    <!-- Logo -->
    <div class="p-6 border-b border-gray-100">
        <a href="/admin/dashboard" class="flex items-center">
            <svg class="h-8 w-8 text-blue-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M13 10V3L4 14h7v7l9-11h-7z"/>
            </svg>
            <h1 class="ml-3 text-lg font-semibold text-gray-800">Admin Panel</h1>
        </a>
    </div>

    <!-- Navigation -->
    <nav class="flex-1 py-4">
        <!-- Main Navigation -->
        <div class="px-4 space-y-1">
            <a href="/admin/dashboard" class="nav-link flex items-center px-3 py-2 text-sm font-medium rounded-md text-gray-700 hover:text-gray-900 hover:bg-gray-50">
                <i class="fas fa-tachometer-alt w-5 h-5 mr-3 text-gray-400"></i>
                <span>Dashboard</span>
            </a>

            <a href="/admin/products" class="nav-link flex items-center px-3 py-2 text-sm font-medium rounded-md text-gray-700 hover:text-gray-900 hover:bg-gray-50">
                <i class="fas fa-box w-5 h-5 mr-3 text-gray-400"></i>
                <span>Products</span>
            </a>

            <a href="/admin/categories" class="nav-link flex items-center px-3 py-2 text-sm font-medium rounded-md text-gray-700 hover:text-gray-900 hover:bg-gray-50">
                <i class="fas fa-tags w-5 h-5 mr-3 text-gray-400"></i>
                <span>Categories</span>
            </a>

            <a href="/admin/users" class="nav-link flex items-center px-3 py-2 text-sm font-medium rounded-md text-gray-700 hover:text-gray-900 hover:bg-gray-50">
                <i class="fas fa-users w-5 h-5 mr-3 text-gray-400"></i>
                <span>Users</span>
            </a>

            <a href="/admin/traffic" class="nav-link flex items-center px-3 py-2 text-sm font-medium rounded-md text-gray-700 hover:text-gray-900 hover:bg-gray-50">
                <i class="fas fa-chart-line w-5 h-5 mr-3 text-gray-400"></i>
                <span>Traffic</span>
            </a>

            <a href="/admin/orders" class="nav-link flex items-center px-3 py-2 text-sm font-medium rounded-md text-gray-700 hover:text-gray-900 hover:bg-gray-50">
                <i class="fas fa-shopping-cart w-5 h-5 mr-3 text-gray-400"></i>
                <span>Orders</span>
                <span id="notification-counter"
                      class="ml-auto bg-red-600 text-white text-xs font-medium px-2 py-0.5 rounded-full"
                      style="display: none;">0</span>
            </a>

            <a href="/admin/revenue" class="nav-link flex items-center px-3 py-2 text-sm font-medium rounded-md text-gray-700 hover:text-gray-900 hover:bg-gray-50">
                <i class="fas fa-dollar-sign w-5 h-5 mr-3 text-gray-400"></i>
                <span>Revenue</span>
            </a>
        </div>

        <!-- Settings -->
        <div class="px-4 mt-8">
            <h3 class="px-3 text-xs font-medium text-gray-500 uppercase tracking-wider mb-3">Settings</h3>
            <div class="space-y-1">
                <a href="/admin/settings" class="nav-link flex items-center px-3 py-2 text-sm font-medium rounded-md text-gray-700 hover:text-gray-900 hover:bg-gray-50">
                    <i class="fas fa-cog w-5 h-5 mr-3 text-gray-400"></i>
                    <span>Settings</span>
                </a>

                <a href="/admin/help" class="nav-link flex items-center px-3 py-2 text-sm font-medium rounded-md text-gray-700 hover:text-gray-900 hover:bg-gray-50">
                    <i class="fas fa-question-circle w-5 h-5 mr-3 text-gray-400"></i>
                    <span>Help</span>
                </a>
            </div>
        </div>
    </nav>

    <!-- Logout -->
    <div class="p-4 border-t border-gray-200">
        <a href="/logout"
           class="w-full flex items-center justify-center px-4 py-2 text-sm font-medium text-red-600 hover:bg-red-50 rounded-md">
            <i class="fas fa-sign-out-alt mr-2"></i>
            <span>Logout</span>
        </a>
    </div>
</div>


</body>
</html>
