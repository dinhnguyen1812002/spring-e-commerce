<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <th:block th:replace="~{Layout :: link-css}"></th:block>
    <style>
        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
        }
    </style>
</head>

<body>
    <header th:fragment="header">
        <nav class="bg-white shadow-md">
            <div class="container mx-auto px-4 py-2 flex justify-between items-center">
                <!-- Logo -->
                <div class="text-2xl font-bold text-gray-800">
                    <a th:href="@{/}">Shop-Ease</a>
                </div>

                <!-- Search Bar -->
                <div class="hidden md:flex items-center w-1/2">
                    <div class="relative w-full">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="fas fa-search text-gray-400"></i>
                        </div>
                        <input type="text" id="searchInput" placeholder="Search for products or categories..."
                            class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all duration-200"
                            oninput="searchProducts()" autocomplete="off" />
                        <div id="searchResults"
                            class="absolute bg-white border border-gray-200 rounded-xl mt-2 w-full hidden shadow-2xl z-50 max-h-[28rem] overflow-y-auto">
                            <!-- Dynamic results will be appended here -->
                        </div>
                    </div>
                </div>

                <!-- Nav Links -->
                <div class="hidden md:flex space-x-4 items-center">
                    <a href="/" class="text-gray-700 hover:text-blue-500">Home</a>
                    <a th:href="@{/products}" class="text-gray-700 hover:text-blue-500">Product</a>
                    <a th:href="@{/about}" class="text-gray-700 hover:text-blue-500">About</a>
                    <a th:href="@{/contact}" class="text-gray-700 hover:text-blue-500">Contact</a>
                    <a href="/admin/dashboard" class="text-gray-700 hover:text-blue-500"
                        sec:authorize="hasAnyAuthority('ADMIN') ">Admin</a>
                </div>

                <div class="flex space-x-4 items-center">
                    <a th:href="@{/cart}"
                        class="bg-transparent hover:bg-blue-500 text-blue-700 font-semibold hover:text-white py-2 px-4 border border-blue-500 hover:border-transparent rounded">
                        cart
                    </a>
                    <div sec:authorize="isAuthenticated()" class="relative">
                        <button id="userDropdownButton" class="flex items-center focus:outline-none">
                            <img th:src="@{/users/{id}/avatar(id=${#authentication.principal.id})}" alt="User Avatar"
                                class="w-8 h-8 rounded-full object-cover"
                                onerror="this.src='/images/default-avatar.png'" />


                            <svg class="w-4 h-4 ml-2" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20"
                                fill="currentColor">
                                <path fill-rule="evenodd"
                                    d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z"
                                    clip-rule="evenodd" />
                            </svg>
                        </button>

                        <div id="userDropdownMenu"
                            class="hidden absolute right-0 mt-2 w-48 bg-white rounded-md overflow-hidden shadow-xl z-10">
                            <a th:href="@{/users/dashboard}"
                                class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">Profile</a>
                            <a href="#" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">Settings</a>
                            <form th:action="@{/logout}" method="post">
                                <button type="submit"
                                    class="block w-full text-left px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">Logout</button>
                            </form>
                        </div>
                    </div>
                    <div sec:authorize="!isAuthenticated()">
                        <a th:href="@{/auth/login}" class="text-gray-700 hover:text-blue-500">Login</a>
                    </div>
                </div>
            </div>

            <!-- Mobile Menu -->
            <div class="md:hidden flex items-center justify-between p-4">
                <button id="mobile-menu-button" class="text-gray-700 hover:text-blue-500 focus:outline-none">
                    <!-- Menu Icon -->
                    <i class="fa-light fa-cart-shopping"></i>
                </button>
            </div>

            <!-- Mobile Menu Dropdown -->
            <div id="mobile-menu" class="hidden md:hidden px-4 pt-2 pb-4">
                <a th:href="@{/}" class="block text-gray-700 hover:text-blue-500 py-1">Home</a>
                <a th:href="@{/products}" class="block text-gray-700 hover:text-blue-500 py-1">Product</a>
                <a th:href="@{/about}" class="block text-gray-700 hover:text-blue-500 py-1">About</a>
                <a th:href="@{/contact}" class="block text-gray-700 hover:text-blue-500 py-1">Contact</a>
            </div>
        </nav>
    </header>
    </nav>
    </header>
</body>

</html>
