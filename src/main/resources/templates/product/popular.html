<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Popular Products</title>
    <!-- CSS Links (Tailwind CSS or your preferred framework) -->
    <th:block th:replace="~{Layout :: link-css}"></th:block>
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<!-- Main Container -->
<div class="container mx-auto px-4 py-8 max-w-6xl">
    <h1 class="text-3xl font-bold mb-6 text-center">Popular Products</h1>
    <p class="text-center text-gray-600 mb-8">Our most popular products based on customer purchases</p>

    <!-- Popular Products Grid -->
    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
        <!-- Loop through each popular product -->
        <div th:each="product : ${popularProducts}" class="bg-white rounded-lg shadow-md overflow-hidden hover:shadow-lg transition-shadow duration-300">
            <div class="relative">
                <img th:src="@{'/' + ${product.image}}" alt="Product Image" class="w-full h-48 object-cover">
                <div class="absolute top-0 right-0 bg-red-600 text-white px-2 py-1 m-2 rounded-md text-xs font-bold">
                    Popular
                </div>
            </div>
            <div class="p-4">
                <h3 class="text-lg font-semibold mb-2 text-gray-800 hover:text-indigo-600 transition-colors duration-300">
                    <a th:href="@{/products/{id}(id=${product.id})}" th:text="${product.name}"></a>
                </h3>
                <p class="text-sm text-gray-600 mb-4 line-clamp-2" th:text="${product.description}"></p>
                <div class="flex justify-between items-center">
                    <span class="text-indigo-600 font-bold" th:text="${#numbers.formatDecimal(product.price, 0, 'COMMA', 0, 'POINT')} + ' ₫'"></span>
                    <form th:action="@{/cart/add}" method="post">
                        <input type="hidden" name="productId" th:value="${product.id}" />
                        <input type="hidden" name="quantity" value="1" />
                        <button type="submit" class="bg-indigo-600 text-white px-3 py-1 rounded-md hover:bg-indigo-700 transition-colors duration-300">
                            Add to Cart
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- No Popular Products Message -->
    <div th:if="${#lists.isEmpty(popularProducts)}" class="text-center py-8">
        <p class="text-gray-600">No popular products available at the moment.</p>
        <a href="/products" class="inline-block mt-4 bg-indigo-600 text-white px-4 py-2 rounded-md hover:bg-indigo-700 transition-colors duration-300">
            Browse All Products
        </a>
    </div>
</div>

<!-- Footer & Common JS -->
<div th:replace="~{fragments/footer :: footer}"></div>
<script th:src="@{/js/toggle.js}" th:fragment="common-js"></script>
</body>
</html>
