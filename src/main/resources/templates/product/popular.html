<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{Layout :: layout( ~{::main})}">
<head>
    <title>Popular Products</title>
</head>
<body>
<main class="container mx-auto px-4 sm:px-6 lg:px-8 py-8">

    <!-- Page Header -->
    <div class="bg-white rounded-lg shadow-sm p-6 mb-8 text-center">
        <h1 class="text-4xl font-extrabold tracking-tight text-gray-900">Our Most Popular Products</h1>
        <p class="mt-2 text-lg text-gray-600">Discover the products that our customers love the most.</p>
    </div>

    <!-- Popular Products Grid -->
    <div th:if="${not #lists.isEmpty(popularProducts)}" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8">
        <div th:each="product : ${popularProducts}" class="group relative border rounded-lg overflow-hidden shadow-sm hover:shadow-xl transition-all duration-300 ease-in-out bg-white">
            <!-- Product Image and Quick View Button -->
            <div class="relative w-full h-64 bg-gray-200 overflow-hidden">
                <a th:href="@{/products/{id}(id=${product.id})}">
                    <img th:src="@{'/' + ${product.image}}" th:alt="${product.name}" class="w-full h-full object-cover object-center group-hover:scale-105 transition-transform duration-500">
                </a>
                <div class="absolute top-2 right-2 bg-red-600 text-white text-xs font-bold px-2 py-1 rounded-full shadow-lg">
                    Popular
                </div>
                <div class="absolute inset-0 bg-gradient-to-t from-black/60 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
                <a th:href="@{/products/{id}(id=${product.id})}" class="absolute bottom-4 left-1/2 -translate-x-1/2 translate-y-4 opacity-0 group-hover:opacity-100 group-hover:translate-y-0 transition-all duration-300 bg-white text-gray-900 py-2 px-4 rounded-full font-semibold text-sm shadow-md">
                    View Details
                </a>
            </div>

            <!-- Product Info -->
            <div class="p-4 text-center">
<!--                <h3 th:if="${product.category}" class="text-sm font-medium text-indigo-600" th:text="${product.category.name}">Category</h3>-->

                <a th:href="@{/products/{id}(id=${product.id})}" class="mt-1 text-lg font-semibold text-gray-800 hover:text-indigo-600 stretched-link" th:text="${product.name}">
                    Product Name
                </a>
                <p class="mt-2 text-xl font-bold text-gray-900" th:text="${#numbers.formatDecimal(product.price, 0, 'COMMA', 0, 'POINT')} + ' ₫'">$Price</p>
            </div>

            <!-- Add to Cart Button -->
            <div class="p-4 border-t bg-gray-50">
                <form th:action="@{/cart/add}" method="post" class="w-full">
                    <input type="hidden" name="productId" th:value="${product.id}" />
                    <input type="hidden" name="quantity" value="1" />
                    <button type="submit" class="w-full flex items-center justify-center bg-indigo-600 text-white py-2.5 px-4 rounded-md hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-colors duration-300">
                        <i class="fas fa-shopping-cart mr-2"></i>
                        Add to Cart
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- No Popular Products Message -->
    <div th:if="${#lists.isEmpty(popularProducts)}" class="text-center py-16">
        <i class="fas fa-star-half-alt fa-4x text-gray-400 mb-4"></i>
        <h2 class="text-2xl font-semibold text-gray-700">No Popular Products Yet</h2>
        <p class="mt-2 text-gray-500">Check back later to see which products are trending.</p>
        <a href="/products" class="mt-6 inline-block bg-indigo-600 text-white px-6 py-3 rounded-md font-semibold hover:bg-indigo-700">
            Browse All Products
        </a>
    </div>

</main>
</body>
</html>
