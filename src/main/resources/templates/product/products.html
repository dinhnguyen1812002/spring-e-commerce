<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product List</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <th:block th:replace="~{Layout :: link-css}"></th:block>
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<!-- Main Container -->
<div class="container mx-auto px-4 py-8 max-w-6xl">
    <h1 class="text-3xl font-bold mb-6 text-center">Danh sách sản phẩm</h1>

    <!-- Add Product & Search Section -->
    <div class="flex justify-between items-center mb-4">
        <a href="/products/add"
           class="inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
            Thêm sản phẩm mới
        </a>
        <form th:action="@{/products/search}" method="get" class="mb-4">
            <div class="flex">
                <input type="text" name="keyword" placeholder="Search products..." th:value="${keyword}" class="flex-grow p-2 border rounded-l-md">
                <button type="submit" class="bg-indigo-600 text-white p-2 rounded-r-md">Search</button>
            </div>
        </form>
    </div>

    <!-- Products Grid -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
        <div th:each="product : ${products}" class="bg-white rounded-lg shadow-md overflow-hidden hover:shadow-lg transition-shadow duration-300">
            <div class="relative">
                <img th:src="@{'/' + ${product.image}}" alt="Product Image" class="w-full h-48 object-cover">
                <div class="absolute top-2 right-2">
                    <span class="bg-red-500 text-white text-xs px-2 py-1 rounded-full">New</span>
                </div>
            </div>
            <div class="p-4">
                <h3 class="text-lg font-semibold mb-2 text-gray-800 hover:text-indigo-600 transition-colors duration-300">
                    <a th:href="@{/products/{id}(id=${product.id})}" th:text="${product.name}"></a>
                </h3>
                
                <!-- Rating Display -->
                <div class="flex items-center mb-2">
                    <div class="flex text-yellow-400 mr-2">
                        <i th:each="i : ${#numbers.sequence(1, 5)}" 
                           th:class="${i <= 4 ? 'fas fa-star' : 'far fa-star'}" 
                           class="text-sm"></i>
                    </div>
                    <span class="text-sm text-gray-500">(4.0)</span>
                </div>
                
                <p class="text-sm text-gray-600 mb-4 line-clamp-2" th:text="${product.description}"></p>
                <div class="flex justify-between items-center">
                    <span class="text-indigo-600 font-bold" th:text="${#numbers.formatDecimal(product.price, 0, 'COMMA', 0, 'POINT')} + ' ₫'"></span>
                    <form th:action="@{/cart/add}" method="post">
                        <input type="hidden" name="productId" th:value="${product.id}" />
                        <input type="hidden" name="quantity" value="1" />
                        <button type="submit" class="bg-indigo-600 text-white px-3 py-1 rounded-md hover:bg-indigo-700 transition-colors duration-300">
                            Add to Cart
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Pagination -->
    <div class="mt-8 flex justify-center">
        <nav class="flex items-center space-x-2">
            <a th:if="${currentPage > 0}" 
               th:href="@{/products(page=${currentPage - 1}, size=${size})}"
               class="px-3 py-2 border border-gray-300 rounded-md text-sm font-medium text-gray-700 hover:bg-gray-50">
                Previous
            </a>
            
            <span th:each="pageNum : ${#numbers.sequence(0, totalPages - 1)}"
                  th:if="${pageNum >= currentPage - 2 and pageNum <= currentPage + 2}">
                <a th:href="@{/products(page=${pageNum}, size=${size})}"
                   th:text="${pageNum + 1}"
                   th:class="${pageNum == currentPage ? 'bg-indigo-600 text-white' : 'text-gray-700 hover:bg-gray-50'}"
                   class="px-3 py-2 border border-gray-300 rounded-md text-sm font-medium">
                </a>
            </span>
            
            <a th:if="${currentPage < totalPages - 1}" 
               th:href="@{/products(page=${currentPage + 1}, size=${size})}"
               class="px-3 py-2 border border-gray-300 rounded-md text-sm font-medium text-gray-700 hover:bg-gray-50">
                Next
            </a>
        </nav>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
