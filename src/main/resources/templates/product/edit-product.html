<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Edit Product</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3B82F6',
                        secondary: '#64748B',
                        success: '#10B981',
                        warning: '#F59E0B',
                        danger: '#EF4444'
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-gray-50">
    <div class="flex h-screen">
        <!-- Sidebar -->
        <div th:replace="~{fragments/sidebar :: sidebar}"></div>

        <!-- Main Content -->
        <div class="flex-1 flex flex-col overflow-hidden">
            <!-- Header -->
            <header class="bg-white shadow-sm border-b border-gray-200">
                <div class="flex items-center justify-between px-6 py-4">
                    <div>
                        <h2 class="text-xl font-semibold text-gray-800">Products Management</h2>
                        <p class="text-sm text-gray-600">edit product</p>
                    </div>
                </div>
            </header>

            <!-- Edit Form Content -->
            <main class="flex-1 overflow-x-hidden overflow-y-auto bg-gray-50">
                <div class="container mx-auto px-6 py-8">
                    <div class="bg-white rounded-lg shadow overflow-hidden">
                        <div class="p-8 w-full">
                            <form th:action="@{/products/update/{id}(id=${product.id})}" th:object="${product}"
                                method="post" enctype="multipart/form-data" class="space-y-6">
                                <div class="grid grid-cols-1 gap-6 md:grid-cols-2">
                                    <div>
                                        <label for="name" class="block text-sm font-medium text-gray-700">Tên Sản
                                            Phẩm</label>
                                        <input type="text" id="name" th:field="*{name}" required
                                            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-1 focus:ring-gray-500 focus:border-gray-500" />
                                    </div>
                                    <div>
                                        <label for="price" class="block text-sm font-medium text-gray-700">Giá
                                            (VND)</label>
                                        <input type="number" id="price" th:field="*{price}" required
                                            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-1 focus:ring-gray-500 focus:border-gray-500"
                                            oninput="formatCurrency(this)" />
                                    </div>
                                    <div>
                                        <label for="stock" class="block text-sm font-medium text-gray-700">Số
                                            lượng</label>
                                        <input type="number" id="stock" th:field="*{stock}" required
                                            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-1 focus:ring-gray-500 focus:border-gray-500" />
                                    </div>
                                </div>

                                <div>
                                    <label for="description" class="block text-sm font-medium text-gray-700">Mô
                                        tả</label>
                                    <textarea id="description" th:field="*{description}" rows="4"
                                        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-1 focus:ring-gray-500 focus:border-gray-500 resize-vertical"
                                        placeholder="Nhập mô tả sản phẩm..."></textarea>
                                </div>

                                <div>
                                    <label for="imageFile" class="block text-sm font-medium text-gray-700">Hình ảnh sản
                                        phẩm</label>
                                    <div
                                        class="mt-1 flex flex-col items-center px-6 pt-5 pb-6 border-2 border-gray-300 border-dashed rounded-md">
                                        <div class="space-y-1 text-center">
                                            <!-- Current image preview -->
                                            <img id="imagePreview"
                                                th:src="${product.image != null} ? @{'/' + ${product.image}} : ''"
                                                th:class="${product.image != null} ? 'mx-auto h-56 w-full object-cover mb-4' : 'hidden mx-auto h-56 w-full object-cover mb-4'">

                                            <div class="flex text-sm text-gray-600 justify-center">
                                                <label for="imageFile"
                                                    class="relative cursor-pointer bg-white rounded-md font-medium text-indigo-600 hover:text-indigo-500 focus-within:outline-none focus-within:ring-2 focus-within:ring-offset-2 focus-within:ring-indigo-500">
                                                    <span><i class="fas fa-upload mr-1"></i> Thay đổi hình ảnh</span>
                                                    <input id="imageFile" name="file" type="file" accept="image/*"
                                                        class="sr-only" onchange="previewImage(event)">
                                                </label>
                                            </div>
                                            <p class="text-xs text-gray-500">PNG, JPG, GIF tối đa 10MB</p>
                                        </div>
                                    </div>
                                </div>

                                <div class="mb-4">
                                    <label for="tags-input" class="block text-sm font-medium text-gray-700">Danh
                                        mục</label>
                                    <div class="tags-input-container mt-1 p-2 border rounded-md flex flex-wrap items-center"
                                        id="tags-input-container">
                                        <input type="text" id="tags-input" placeholder="Thêm danh mục và nhấn Enter"
                                            class="flex-grow focus:outline-none text-sm" />
                                    </div>
                                    <div class="mt-2">
                                        <label for="dropdown-categories"
                                            class="block text-sm font-medium text-gray-700">Chọn danh mục</label>
                                        <select th:field="*{categories}" id="dropdown-categories"
                                            name="selectedCategories"
                                            class="block w-full mt-1 focus:ring-indigo-500 focus:border-indigo-500 border-gray-300 rounded-md shadow-sm sm:text-sm"
                                            multiple>
                                            <option th:each="category : ${categories}" th:value="${category.id}"
                                                th:text="${category.name}"></option>
                                        </select>
                                    </div>
                                    <input type="hidden" id="categories" name="categories" />
                                </div>

                                <div class="flex gap-4">
                                    <a th:href="@{/admin/products}"
                                        class="flex-1 flex justify-center py-2 px-4 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-gray-500">
                                        Hủy
                                    </a>
                                    <button type="submit"
                                        class="flex-1 flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
                                        Lưu Thay Đổi
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script th:src="@{/js/add-product.js}"></script>
    <script th:src="@{/js/toggle.js}" th:fragment="common-js"></script>
    <div th:replace="~{fragments/footer :: footer}"></div>
</body>

</html>
