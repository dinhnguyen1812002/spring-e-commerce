<script>
    function changeMainImage(src) {
        document.getElementById('mainImage').src = src;
    }

    function incrementQuantity() {
        const quantityInput = document.getElementById('quantity');
        quantityInput.value = parseInt(quantityInput.value) + 1;
    }

    function decrementQuantity() {
        const quantityInput = document.getElementById('quantity');
        if (parseInt(quantityInput.value) > 1) {
            quantityInput.value = parseInt(quantityInput.value) - 1;
        }
    }

    function buyNow() {
        const form = document.getElementById('addToCartForm');
        // Thêm input hidden cho việc mua ngay
        const buyNowInput = document.createElement('input');
        buyNowInput.type = 'hidden';
        buyNowInput.name = 'buyNow';
        buyNowInput.value = 'true';
        form.appendChild(buyNowInput);
        form.submit();
    }

    // Star rating functionality
    document.addEventListener('DOMContentLoaded', function () {
        const starButtons = document.querySelectorAll('.star-btn');
        const starInput = document.getElementById('star');

        starButtons.forEach(btn => {
            btn.addEventListener('click', function () {
                const rating = parseInt(this.getAttribute('data-rating'));
                starInput.value = rating;

                // Reset all stars
                starButtons.forEach(button => {
                    button.classList.remove('text-yellow-400');
                    button.classList.add('text-gray-300');
                });

                // Fill stars up to selected rating
                for (let i = 0; i < rating; i++) {
                    starButtons[i].classList.remove('text-gray-300');
                    starButtons[i].classList.add('text-yellow-400');
                }
            });
        });

        // Set default 5 stars
        for (let i = 0; i < 5; i++) {
            starButtons[i].classList.remove('text-gray-300');
            starButtons[i].classList.add('text-yellow-400');
        }
        // Star hover effect
        starButtons.forEach((btn, index) => {
            btn.addEventListener('mouseenter', function () {
                // Reset all stars
                starButtons.forEach(button => {
                    button.classList.remove('text-yellow-400');
                    button.classList.add('text-gray-300');
                });

                // Fill stars up to current hover position
                for (let i = 0; i <= index; i++) {
                    starButtons[i].classList.remove('text-gray-300');
                    starButtons[i].classList.add('text-yellow-400');
                }
            });
        });

        // Restore selected rating when mouse leaves the rating container
        const starRating = document.querySelector('.star-rating');
        starRating.addEventListener('mouseleave', function () {
            const rating = parseInt(starInput.value);

            // Reset all stars
            starButtons.forEach(button => {
                button.classList.remove('text-yellow-400');
                button.classList.add('text-gray-300');
            });

            // Fill stars up to saved rating
            for (let i = 0; i < rating; i++) {
                starButtons[i].classList.remove('text-gray-300');
                starButtons[i].classList.add('text-yellow-400');
            }
        });
    });
</script>
