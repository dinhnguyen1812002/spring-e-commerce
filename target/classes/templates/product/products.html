<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{Layout :: layout(~{::main})}">

<head>
    <title>Our Products</title>
</head>

<body>
    <main class="min-h-screen bg-white">
        <div class="container mx-auto px-4 sm:px-6 lg:px-8 py-8">

            <!-- Page Header -->
            <!--        <div class="bg-white rounded-xl shadow-sm p-8 mb-8 border border-gray-100">-->
            <!--            <div class="text-center">-->
            <!--                <h1 class="text-4xl font-bold text-gray-900 mb-3">Discover Our Products</h1>-->
            <!--                <p class="text-lg text-gray-600 max-w-2xl mx-auto">Browse our carefully curated collection of high-quality items, each designed to meet your needs and exceed your expectations.</p>-->
            <!--            </div>-->
            <!--        </div>-->


            <!-- Search and Filter Section -->
            <div class="flex py-6 mb-8 border-b border-gray-200">
                <div class="flex flex-row justify-between items-center w-full space-x-6">
                    <!-- Search Form -->
                    <form th:action="@{/products/search}" method="get" class="flex-1">
                        <div class="relative">
                            <!-- <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor"
                                    viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                                </svg>
                            </div> -->
                            <input type="search" name="keyword" placeholder="Search products..." th:value="${keyword}"
                                class="w-full pl-9 pr-12 py-2.5 text-sm text-gray-900 border border-gray-200 bg-gray-50 focus:bg-white focus:border-gray-900 focus:outline-none transition-colors">
                            <button type="submit" class="absolute inset-y-0 right-0 flex items-center pr-3">
                                <div class="bg-gray-900 hover:bg-gray-700 text-white p-1.5 transition-colors">
                                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                            d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                                    </svg>
                                </div>
                            </button>
                        </div>
                    </form>

                    <!-- Filter -->
                    <form th:action="@{/products}" method="get" class="flex items-center space-x-3">
                        <div class="relative">
                            <select name="category"
                                class="appearance-none bg-white border border-gray-200 px-4 py-2.5 pr-8 text-sm text-gray-700 focus:border-gray-900 focus:outline-none">
                                <option value="">All Categories</option>
                                <option th:each="cat : ${categories}" th:value="${cat.slug}" th:text="${cat.name}"
                                    th:selected="${cat.slug == selectedCategory}">
                                </option>
                            </select>
                            <div class="absolute inset-y-0 right-0 flex items-center px-2 pointer-events-none">
                                <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor"
                                    viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M19 9l-7 7-7-7" />
                                </svg>
                            </div>
                        </div>
                        <button type="submit"
                            class="px-4 py-2.5 bg-gray-900 text-white text-sm font-medium hover:bg-gray-700 transition-colors">
                            Filter
                        </button>
                    </form>
                </div>
            </div>



            <!-- Products Grid -->
            <div th:if="${not #lists.isEmpty(products)}"
                class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8">
                <div th:each="product : ${products}" class="group">

                    <!-- Product Image -->
                    <div class="relative w-full aspect-square bg-gray-100 mb-4 overflow-hidden">
                        <a th:href="@{/products/{id}(id=${product.id})}">
                            <img th:src="@{'/' + ${product.image}}" th:alt="${product.name}"
                                class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                        </a>

                        <!-- Quick Add (hover) -->
                        <div
                            class="absolute bottom-4 left-4 right-4 opacity-0 group-hover:opacity-100 transition-opacity duration-300">
                            <form th:action="@{/cart/add}" method="post" class="w-full">
                                <input type="hidden" name="productId" th:value="${product.id}" />
                                <input type="hidden" name="quantity" value="1" />
                                <button type="submit"
                                    class="w-full bg-white text-gray-900 py-3 px-4 font-medium hover:bg-gray-900 hover:text-white transition-colors duration-200">
                                    Add to Cart
                                </button>
                            </form>
                        </div>
                    </div>

                    <!-- Product Info -->
                    <div>
                        <!-- Category -->
                        <div class="mb-2">
                            <span th:each="category, iterStat : ${product.categories}"
                                th:text="${category.name + (iterStat.last ? '' : ', ')}"
                                class="text-xs text-gray-500 uppercase tracking-wide">
                            </span>
                        </div>

                        <!-- Name -->
                        <h3 class="font-medium text-gray-900 mb-2">
                            <a th:href="@{/products/{id}(id=${product.id})}" th:text="${product.name}"
                                class="hover:text-gray-600 transition-colors line-clamp-2">
                            </a>
                        </h3>

                        <!-- Price + Rating -->
                        <div class="flex items-center justify-between">
                            <span class="text-lg font-medium text-gray-900"
                                th:text="${#numbers.formatDecimal(product.price, 0, 'COMMA', 0, 'POINT')} + ' ₫'">
                            </span>
                            <div class="flex items-center text-sm text-gray-500">
                                <svg class="w-4 h-4 mr-1 text-gray-900" fill="currentColor" viewBox="0 0 20 20">
                                    <path
                                        d="M10 15l-5.878 3.09 1.123-6.545L.489 6.91l6.572-.955L10 0l2.939 5.955 6.572.955-4.756 4.635 1.123 6.545z" />
                                </svg>
                                <span>4.5</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- No Products Found Message -->
            <div th:if="${#lists.isEmpty(products)}" class="text-center py-16">
                <div class="bg-white rounded-xl shadow-sm p-12 border border-gray-100">
                    <svg class="w-16 h-16 text-gray-400 mx-auto mb-4" fill="none" stroke="currentColor"
                        viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4" />
                    </svg>
                    <h2 class="text-2xl font-bold text-gray-700 mb-2">No Products Found</h2>
                    <p class="text-gray-500 mb-6">We couldn't find any products matching your search criteria.</p>
                    <div class="flex flex-col sm:flex-row gap-4 justify-center">
                        <a href="/products"
                            class="inline-block bg-blue-600 text-white px-6 py-3 rounded-lg font-semibold hover:bg-blue-700 transition-colors">
                            View All Products
                        </a>
                        <button
                            class="inline-block border border-gray-300 text-gray-700 px-6 py-3 rounded-lg font-semibold hover:bg-gray-50 transition-colors">
                            Reset Filters
                        </button>
                    </div>
                </div>
            </div>

            <!-- Pagination -->
            <div th:if="${totalPages > 1}" class="mt-12 flex justify-center">
                <nav class="bg-white rounded-lg shadow-sm border border-gray-200 p-2" aria-label="Pagination">
                    <div class="flex items-center space-x-1">
                        <a th:href="@{/products(page=${currentPage - 1}, size=${size}, keyword=${keyword})}"
                            th:classappend="${currentPage == 0} ? 'pointer-events-none text-gray-300' : 'text-gray-700 hover:bg-gray-100'"
                            class="relative inline-flex items-center px-3 py-2 rounded-md text-sm font-medium transition-colors">
                            <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M15 19l-7-7 7-7" />
                            </svg>
                            Previous
                        </a>

                        <th:block th:each="pageNum : ${#numbers.sequence(0, totalPages - 1)}">
                            <a th:if="${pageNum >= currentPage - 2 and pageNum <= currentPage + 2}"
                                th:href="@{/products(page=${pageNum}, size=${size}, keyword=${keyword})}"
                                th:text="${pageNum + 1}"
                                th:classappend="${pageNum == currentPage} ? 'bg-blue-600 text-white' : 'text-gray-700 hover:bg-gray-100'"
                                class="relative inline-flex items-center px-4 py-2 rounded-md text-sm font-medium transition-colors">
                            </a>
                        </th:block>

                        <a th:href="@{/products(page=${currentPage + 1}, size=${size}, keyword=${keyword})}"
                            th:classappend="${currentPage == totalPages - 1} ? 'pointer-events-none text-gray-300' : 'text-gray-700 hover:bg-gray-100'"
                            class="relative inline-flex items-center px-3 py-2 rounded-md text-sm font-medium transition-colors">
                            Next
                            <svg class="w-4 h-4 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M9 5l7 7-7 7" />
                            </svg>
                        </a>
                    </div>
                </nav>
            </div>

        </div>
    </main>
</body>

</html>
