<!DOCTYPE html>
<!--
This is the main layout file. Pages can use this layout by setting the following in their root element:
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{Layout :: layout(~{::title}, ~{::main})}">

This requires the page to have a <title> and a <main> element.
-->
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
    th:fragment="layout(mainContent)">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Add user ID for WebSocket notifications if user is authenticated -->
    <meta name="user-id" th:if="${#authentication != null && #authentication.principal != null}"
        th:content="${#authentication.principal}">

    <!-- The title of the page will be replaced by the content of the <title> tag in the child template -->
    <!--    <title th:replace="${pageTitle}">E-Commerce Application</title>-->

    <!--
      This block is defined as a fragment so that other pages,
      which do not use the full layout, can still include the CSS.
      e.g., <th:block th:replace="~{Layout :: link-css}"></th:block>
    -->
    <th:block th:fragment="link-css">
        <link rel="stylesheet" th:href="@{/css/main.css}">
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
            integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw=="
            crossorigin="anonymous" referrerpolicy="no-referrer" />
    </th:block>

    <!-- WebSocket libraries for real-time notifications -->
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stomp-websocket@2.3.4-next/lib/stomp.min.js"></script>

    <style>
        /* Toast notification styles */
        @keyframes slideIn {
            from {
                transform: translateY(100%);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        @keyframes slideOut {
            from {
                transform: translateY(0);
                opacity: 1;
            }

            to {
                transform: translateY(100%);
                opacity: 0;
            }
        }

        .toast-enter {
            animation: slideIn 0.3s ease-out forwards;
        }

        .toast-exit {
            animation: slideOut 0.3s ease-in forwards;
        }

        /* Notification badge pulse animation */
        @keyframes pulse {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.1);
            }

            100% {
                transform: scale(1);
            }
        }

        .animate-pulse {
            animation: pulse 1.5s infinite;
        }
    </style>
</head>

<body class="bg-gray-50 text-gray-800 flex flex-col min-h-screen font-sans">

    <!-- Header fragment is inserted here -->
    <header th:replace="~{fragments/header :: header}"></header>

    <!-- Main content from the calling page is inserted here. -->
    <main th:insert="${mainContent}"></main>

    <!-- Footer fragment is inserted here -->
    <footer th:replace="~{fragments/footer :: footer}"></footer>

    <!-- Global Scripts -->
    <script th:src="@{/js/toggle.js}"></script>
    <script th:src="@{/js/search.js}"></script>

    <!-- WebSocket notifications for authenticated users -->
    <script th:if="${#authentication != null && #authentication.principal != null}"
        th:src="@{/js/user-notifications.js}"></script>

</body>

</html>
