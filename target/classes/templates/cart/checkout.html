<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" class="h-full bg-white">
<head>
    <title>Thanh toán đơn hàng</title>
    <th:block th:replace="~{Layout :: link-css}"></th:block>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"/>
</head>
<body class="h-full bg-white">
<div th:replace="~{fragments/header :: header}"></div>

<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 bg-white">
    <h2 class="text-3xl font-extrabold text-gray-900 mb-8 text-center">Thanh toán đơn hàng</h2>
    <!-- Progress Bar -->
    <div class="max-w-3xl mx-auto mt-6 mb-8">
        <ol class="flex items-center w-full text-sm font-medium text-center text-gray-500">
            <li class="flex-1 flex items-center">
                <span class="flex items-center justify-center w-8 h-8 rounded-full bg-indigo-600 text-white">1</span>
                <span class="ml-2 font-semibold text-indigo-700">Giỏ hàng</span>
                <span class="flex-1 h-1 bg-indigo-300 mx-2"></span>
            </li>
            <li class="flex-1 flex items-center">
                <span class="flex items-center justify-center w-8 h-8 rounded-full bg-indigo-600 text-white">2</span>
                <span class="ml-2 font-semibold text-indigo-700">Địa chỉ</span>
                <span class="flex-1 h-1 bg-indigo-300 mx-2"></span>
            </li>
            <li class="flex-1 flex items-center">
                <span class="flex items-center justify-center w-8 h-8 rounded-full bg-gray-200">3</span>
                <span class="ml-2">Thanh toán</span>
                <span class="flex-1 h-1 bg-gray-200 mx-2"></span>
            </li>
            <li class="flex items-center">
                <span class="flex items-center justify-center w-8 h-8 rounded-full bg-gray-200">4</span>
                <span class="ml-2">Xác nhận</span>
            </li>
        </ol>
    </div>
    <div class="flex flex-col lg:flex-row gap-8">
        <!-- Form nhập thông tin giao hàng và thanh toán -->
        <div class="w-full lg:w-2/3">
            <form th:action="@{/orders/checkout}" method="post" class="bg-white shadow rounded-lg p-8 space-y-6">
                <h3 class="text-xl font-bold text-gray-900 mb-4">Thông tin giao hàng</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label for="fullName" class="block text-sm font-medium text-gray-700 mb-1">Họ và tên</label>
                        <input type="text" id="fullName" name="fullName" required placeholder="Nhập họ tên"
                               class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-300 focus:ring focus:ring-indigo-200 focus:ring-opacity-50 px-3 py-2"/>
                    </div>
                    <div>
                        <label for="phone" class="block text-sm font-medium text-gray-700 mb-1">Số điện thoại</label>
                        <input type="tel" id="phone" name="phone" pattern="[0-9]{10}" minlength="10" maxlength="10"  required placeholder="Nhập số điện thoại"
                               class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-300 focus:ring focus:ring-indigo-200 focus:ring-opacity-50 px-3 py-2"/>
                    </div>
                </div>
                <div>
                    <label for="address" class="block text-sm font-medium text-gray-700 mb-1">Địa chỉ giao hàng</label>
                    <input type="text" id="address" name="address" required placeholder="Nhập địa chỉ giao hàng"
                           class="mt-1 block w-full rounded-md border-gray-300 shadow-sm
                           focus:border-indigo-300 focus:ring focus:ring-indigo-200 focus:ring-opacity-50 px-3 py-2"/>
                </div>
                <div>
                    <label for="note" class="block text-sm font-medium text-gray-700 mb-1">Ghi chú (tuỳ chọn)</label>
                    <textarea id="note" name="note" rows="2" placeholder="Ghi chú cho đơn hàng (nếu có)"
                              class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-300 focus:ring focus:ring-indigo-200 focus:ring-opacity-50 px-3 py-2"></textarea>
                </div>
                <h3 class="text-xl font-bold text-gray-900 mb-4">Phương thức thanh toán</h3>
                <div class="space-y-2">
                    <label class="flex items-center">
                        <input type="radio" name="paymentMethod" value="CREDIT_CARD" required class="mr-2">
                        <span>Thẻ tín dụng/ghi nợ</span>
                    </label>
                    <label class="flex items-center">
                        <input type="radio" name="paymentMethod" value="PAYPAL" required class="mr-2">
                        <span>PayPal</span>
                    </label>
                    <label class="flex items-center">
                        <input type="radio" name="paymentMethod" value="CASH_ON_DELIVERY" required class="mr-2">
                        <span>Thanh toán khi nhận hàng (COD)</span>
                    </label>
                </div>
                <button type="submit"
                        class="w-full flex justify-center py-3 px-4 border border-transparent rounded-md shadow-sm text-base font-semibold text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition mt-6">
                    Xác nhận đặt hàng
                </button>
            </form>
        </div>
        <!-- Tóm tắt đơn hàng -->
        <div class="w-full lg:w-1/3">
            <div class="bg-white shadow-lg rounded-lg p-8 sticky top-8">
                <h3 class="text-lg font-bold text-gray-900 mb-6 text-center">Tóm tắt đơn hàng</h3>
                <div th:each="item : ${cart.cartItems}" class="flex items-center justify-between mb-4">
                    <div class="flex items-center gap-3">
                        <img th:src=" '/'+ ${item.product.image}" alt="Ảnh sản phẩm" class="w-14 h-14 object-cover rounded border">
                        <div>
                            <div th:text="${item.product.name}" class="text-sm font-medium text-gray-800"></div>
                            <div class="text-xs text-gray-500">x <span th:text="${item.quantity}"></span></div>
                        </div>
                    </div>
                    <div th:text="${#numbers.formatDecimal(item.product.price * item.quantity, 0, 'COMMA', 0, 'POINT')} + ' VND'" class="text-sm font-semibold text-indigo-700"></div>
                </div>
                <div class="border-t my-4"></div>
                <div class="flex justify-between mb-2">
                    <span>Tổng phụ:</span>
                    <span th:text="${#numbers.formatDecimal(cart.totalPrice, 0, 'COMMA', 0, 'POINT')} + ' VND'"></span>
                </div>
                <div class="flex justify-between mb-2">
                    <span>Phí vận chuyển:</span>
                    <span>20,000 VND</span>
                </div>
                <div class="flex justify-between mb-2">
                    <span>Thuế (10%):</span>
                    <span th:text="${#numbers.formatDecimal(cart.totalPrice * 0.1, 0, 'COMMA', 0, 'POINT')} + ' VND'"></span>
                </div>
                <div class="border-t my-4"></div>
                <div class="flex justify-between text-lg font-bold">
                    <span>Tổng cộng:</span>
                    <span th:text="${#numbers.formatDecimal(cart.totalPrice + 20000 + cart.totalPrice * 0.1, 0, 'COMMA', 0, 'POINT')} + ' VND'"></span>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
